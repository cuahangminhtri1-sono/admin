/* ══════════════════════════ DỌN SHOP ĐÃ NGHỈ ══════════════════════════
   VÌ SAO: shop bỏ app (qua dùng app khác, dùng thử xong bỏ…) thì chỉ đơn giản là NGỪNG GIA HẠN —
   dữ liệu + ảnh của họ nằm lại mãi trên Firebase, chủ phần mềm trả tiền lưu hằng tháng.
   ĐỦ ĐIỀU KIỆN DỌN (thiếu 1 điều là KHÔNG dọn):
     • MỌI gói Sổ Nợ + Bán hàng (mã sono…) hết hạn quá 180 ngày (+1 ngày chống lệch giờ máy chủ),
       không gói nào vĩnh viễn, không gói nào thiếu / sai kiểu ngày hết hạn;
     • không có đơn gia hạn nhóm Sổ Nợ đang chờ; không có dòng thu nhóm Sổ Nợ trong 180 ngày;
     • chưa bấm "Giữ"; không phải tài khoản quản trị.
   DỌN = (1) tải 1 file sao lưu về máy bạn (app "sono-don-nghi" — khôi phục bằng nút "Khôi phục
     từ file" trong bảng này) → (2) xoá ảnh trên Storage (chứng từ, sản phẩm, chữ ký) → (3) xoá dữ
     liệu Sổ Nợ + Bán hàng trên Firestore → (4) gỡ link nợ / hoá đơn / thực đơn QR / link online /
     đơn QR / liên kết máy nhân viên.
   GIỮ NGUYÊN: tài khoản, giấy phép, sổ doanh thu, đơn gia hạn cũ ⇒ khách quay lại vẫn đăng nhập,
     gia hạn như thường (như shop mới; muốn lấy lại dữ liệu thì nạp file sao lưu).
   AN TOÀN: đọc lại giấy phép TRÊN MÁY CHỦ ngay trước khi xoá từng shop · mọi lượt đọc phải là số
     thật trên máy chủ (không nhận bộ đệm) · xoá ẢNH TRƯỚC — Storage Rules tự kiểm "hết hạn quá 180
     ngày" lần nữa, sai là chặn, dữ liệu chưa bị đụng · dừng giữa chừng thì lần sau làm tiếp, KHÔNG
     sao lưu đè bằng dữ liệu đã xoá dở · dữ liệu app khác (TrọSafe, Cafe…) không bị đụng.
   ĐỔI MỐC 180 NGÀY: sửa DN.NGAY bên dưới VÀ 2 chỗ (180 · 15552000000) trong Storage Rules.       */
const DN = { NGAY:180, MOI_LAN:25, LO:250 };
const DN_GOC = ["meta","staff","suppliers","supplier_payments","pos_nv","_diag"];
const dnLaSono = a => String(a || "").indexOf("sono") === 0;
Object.assign(TEN_VIEC, { don_shop_nghi:"Dọn dữ liệu shop đã nghỉ", giu_du_lieu:"Giữ lại dữ liệu (không dọn)", bo_giu_du_lieu:"Bỏ giữ dữ liệu" });

/* Mọi gói nhóm Sổ Nợ đều hết hạn quá mốc? → { moi, qua } (moi = ngày hết hạn muộn nhất) hoặc null */
function dnHetHan(L, now){
  if(!L || !L.length) return null;
  if(!L.some(l => l && (l.app === "sono" || l.app === "sono_pos"))) return null;   /* Storage Rules soi đúng 2 gói này */
  let moi = 0;
  for(const l of L){
    if(!l || l.vinhVien === true) return null;
    const h = hanRules(l.paidUntil);
    if(h == null) return null;
    if(h > moi) moi = h;
  }
  const qua = Math.floor((now - moi) / 864e5);
  return qua >= DN.NGAY + 1 ? { moi, qua } : null;
}
function dsNghi(){
  const now = Date.now(), toi = (auth.currentUser && auth.currentUser.uid) || "";
  const theo = {};
  LIC.forEach(l => { if(l && l.uid && dnLaSono(l.app)) (theo[l.uid] = theo[l.uid] || []).push(l); });
  const cho = new Set(REQ.filter(r => r && r._uid && rCho(r) && dnLaSono(r._app || "sono")).map(r => r._uid));
  const vuaTra = new Set(PAY.filter(p => { if(!p || !p.uid || !dnLaSono(p.app || "sono")) return false;
    const d = pNgay(p); return !!d && (now - d) < DN.NGAY * 864e5; }).map(p => p.uid));
  const du = [], giu = [], xong = [], doDang = [];
  Object.keys(theo).forEach(uid => {
    if(uid === toi || String(emailCua(uid) || "").toLowerCase() === CFG.admin) return;
    const a = ACC[uid] || {}, dd = (a.donDuLieu && typeof a.donDuLieu === "object") ? a.donDuLieu : null;
    const dang = !!(dd && dd.batDau && !dd.xong);
    const h = dnHetHan(theo[uid], now);
    const row = { uid, email: emailCua(uid) || uid, L: theo[uid], dd, dang, moi: h ? h.moi : 0, qua: h ? h.qua : 0 };
    if(!h || cho.has(uid) || vuaTra.has(uid)){ if(dang) doDang.push(row); return; }
    const xl = dd && ngay(dd.xong);
    if(xl && xl.getTime() >= h.moi){ xong.push(row); return; }
    if(a.giuDuLieu === true){ (dang ? doDang : giu).push(row); return; }
    du.push(row);
  });
  du.sort((a,b) => (Number(b.dang) - Number(a.dang)) || (b.qua - a.qua));
  giu.sort((a,b) => b.qua - a.qua);
  xong.sort((a,b) => (ngay(b.dd && b.dd.xong) || 0) - (ngay(a.dd && a.dd.xong) || 0));
  return { du, giu, xong, doDang };
}

function dnLoi(e){
  const m = maLoi(e);
  if(/storage\/unauthori[sz]ed|storage\/unauthenticated/.test(m)) return "máy chủ (Storage Rules) chưa cho xoá ảnh — kiểm tra đã dán Storage Rules mới chưa";
  if(/permission-denied/.test(m)) return "Firestore Rules chặn (" + m + ")";
  if(/unavailable|offline|network|retry-limit|failed to fetch|chập chờn|mất mạng/i.test(m)) return "mất mạng giữa chừng — có mạng lại thì bấm Dọn để làm tiếp";
  return m;
}

/* ─────────── Đọc & xoá — mọi lượt đọc phải là số thật trên máy chủ ─────────── */
function dnThat(s){ if(s && s.metadata && s.metadata.fromCache) throw new Error("mạng chập chờn — chưa đọc được số thật trên máy chủ"); return s; }

async function dnLayKho(uid){
  const kho = { uid, meta:[], customers:[], branches:[], pos:{} };

  for(const n of CDL_GOC) kho[n] = await dnLay("users",uid,n);
  kho.branches = await dnLay("users",uid,"branches");
  const ids = ["main"].concat(kho.branches.map(b => b.id).filter(x => x !== "main"));
  /* [3.8] + cửa hàng đã xoá ở app bản cũ (chỉ xoá tên) mà dữ liệu bên trong còn ⇒ sao lưu luôn trước khi dọn */
  const dr = kho.meta.find(m => m.id === "donRac");

  for(const b of ids){

    kho.pos[b] = bd;
  }
  return kho;
}
/* Xoá sạch 1 kho / 1 truy vấn theo lô; 'truoc' = dọn kho con của từng doc trước khi xoá doc */
async function dnQuet(q, truoc){
  let dem = 0;
  for(let v = 0; v < 4000; v++){
    if(!navigator.onLine) throw new Error("mất mạng");
    const s = dnThat(await getDocs(query(q, limit(DN.LO))));
    if(s.empty) return dem;
    if(truoc) for(const d of s.docs) dem += await truoc(d);
    const b = writeBatch(fdb); s.docs.forEach(d => b.delete(d.ref)); await b.commit();
    dem += s.size;
  }
  throw new Error("quá nhiều bản ghi — bấm Dọn lại để làm tiếp");
}

    const hu = kq.find(x => x && typeof x === "object" && x.loi);
    if(hu){ const e = new Error(hu.loi); e.code = hu.loi; throw e; }

async function dnXoaDuLieu(uid, log, tok){

async function dnXoaLink(uid, log, tok){

async function dnDonShop(x, tenFile, log){

/* Khôi phục: nhận file "sono-don-nghi" (nhiều shop) hoặc "sono-full" → mở đúng bảng Nạp file sẵn có */
function dnChonFile(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    let obj = null;
    try{ obj = JSON.parse(await f.text()); }catch(e){ return bao("File hỏng hoặc không phải .json", 1); }
    if(obj && obj.app === "sono-full"){
      if(!obj.ownerUid) return bao("File không ghi tài khoản chủ — mở hồ sơ khách rồi nạp", 1);
      return moNapFile(String(obj.ownerUid), obj, f.name);
    }
    const ds = (obj && obj.app === "sono-don-nghi" && Array.isArray(obj.shops))
      ? obj.shops.filter(x => x && x.uid && x.data && x.data.app === "sono-full") : [];
    if(!ds.length) return bao("Không phải file sao lưu của Dọn shop đã nghỉ", 1);
    if(ds.length === 1) return moNapFile(String(ds[0].uid), ds[0].data, f.name);
    const t = moTam({ tieuDe:"Khôi phục shop nào?" });
    t.S = { dnKp: ds, dnTen: f.name };
    t.than.innerHTML = `<p class="nho">File ${esc(f.name)} · ${ds.length} shop. Chọn shop cần nạp lại dữ liệu:</p>
      <div class="nhom">${ds.map((x, i) => dongHtml({ the:"button", act:"dn-kp-chon", data:`data-i="${i}"`, ic:"khach",
        t: esc(x.email || x.uid), d: esc(`${num(x.soBanGhi)} bản ghi`), mui:true })).join("")}</div>`;
  };
  document.body.appendChild(inp); inp.click();
}

   App bán hàng (bản 2026-10-01-DON1 trở lên) TỰ DỌN trên máy chủ shop. Bảng này là LƯỚI AN TOÀN cho phần

const DR = { NGAY:30, MOI_LAN:20, SO_CN:10, TRANG:300, CHAT:30, DON_XL:3, CHO_ONL:7, CHO_BAN:2, LICH:2 };

async function drXoaRef(refs){
  for(let i = 0; i < refs.length; i += DN.LO){ const b = writeBatch(fdb); refs.slice(i, i + DN.LO).forEach(r => b.delete(r)); await b.commit(); }
  return refs.length;
}
/* Link vừa cập nhật trong 2 ngày ⇒ chưa đụng (chống va chạm lúc shop đang tạo link) — updatedAt là chữ "8:05 ngày 1/10/2026" */
function drMoi(s){
  const m = /(\d{1,2}):(\d{2}) ngày (\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || ""));
  if(!m) return false;
  const d = new Date(+m[5], +m[4] - 1, +m[3], +m[1], +m[2]);
  return !isNaN(d) && (Date.now() - d.getTime()) < 2 * 864e5;
}

  const h = Number(d && d.henMoi) || 0; if(h > 0) return h;
  const its = Array.isArray(d && d.items) ? d.items : [];
  for(const x of its){ const v = Number(x && x.h) || 0; if(v > 0) return v; }
  return 0;
}
function drNenXoaDon(o, now){
  const tt = String(o.tt || ""), t = drMs(o.taoLuc) || Number(o.tsClient) || 0, N = 864e5;
  if(tt === "cho"){
    const h = drHen(o);
    if(h > 0) return h < now - DR.LICH * N;                                 /* đặt lịch còn chờ: chỉ xoá khi đã qua giờ hẹn */
    return !!t && t < now - (o.kieu === "online" ? DR.CHO_ONL : DR.CHO_BAN) * N;
  }
  if(tt === "lich"){ const h = drHen(o); return h > 0 ? h < now - DR.LICH * N : (!!t && t < now - 7 * N); }
  if(tt === "xong" || tt === "bo"){ const x = drMs(o.xuLy) || t; return !!x && x < now - DR.DON_XL * N; }
  if(tt === "nhan" || tt === "huy") return !!t && t < now - DR.DON_XL * N;
  return false;                                                             /* trạng thái lạ ⇒ không đụng */
}
/* Mã cửa hàng app có thể đã cấp (mã cố định theo ngành) */
function drMaDo(){
  const a = ["main_fnb","main_fs","main_rm","main_kg"];
  ["cn_","cn_fnb_","cn_fs_","cn_rm_","cn_kg_"].forEach(p => { for(let i = 1; i <= DR.SO_CN; i++) a.push(p + i); });
  return a;
}
/* Mã cửa hàng gặp trong đơn / tin nhắn / link QR của shop (bắt cả mã đời cũ không theo mẫu) */
async function drCnGoiY(uid){
  const s = new Set();
  for(const c of ["qr_don","qr_chat","shares_qr"]){
    const q = dnThat(await getDocs(query(collection(fdb,c), where("ownerUid","==",uid))));
    q.forEach(d => { const b = (d.data() || {}).chiNhanh; if(typeof b === "string" && b) s.add(b); });
  }
  return [...s];
}
/* Cửa hàng ĐÃ XOÁ (không còn doc) mà dữ liệu bên trong còn nằm lại — bản app cũ chỉ xoá tên */
async function drCnSot(uid, song, them){
  const bo = new Set(song);
  const ds = [...new Set(drMaDo().concat(them || []))].filter(b => b && b !== "main" && !bo.has(b) && /^[A-Za-z0-9_-]{1,80}$/.test(b));
  const co = [];
  const kq = await theoLo(ds, 8, async b => {
    for(const n of DR_DO){ const s = dnThat(await getDocs(query(bcol(uid, b, n), limit(1)))); if(!s.empty){ co.push(b); return 1; } }
    return 0;
  });
  drNem(kq);
  return co.sort();
}
/* Hoá đơn nào còn đơn (mọi cửa hàng còn sống) — hỏi 30 mã một lượt */
async function drHdSong(uid, song, toks){
  const con = new Set(), lo = [];
  for(let i = 0; i < toks.length; i += 30) lo.push(toks.slice(i, i + 30));
  for(const b of song){
    const can = lo.map(l => l.filter(t => !con.has(t))).filter(l => l.length);
    if(!can.length) break;
    const kq = await theoLo(can, 6, async l => {
      const s = dnThat(await getDocs(query(bcol(uid, b, "orders"), where("hdToken","in",l))));
      s.forEach(d => { const h = (d.data() || {}).hdToken; if(h) con.add(String(h)); });
      return 1;
    });
    drNem(kq);
  }
  return con;
}
/* Chữ ký của link đã THU HỒI (doc link mất, chữ ký còn) — dọn theo mã lấy từ khách / đơn */
async function drChuKyMa(uid, toks){
  let dem = 0;
  const kq = await theoLo(toks, 6, async t => {
    const s = dnThat(await getDoc(doc(fdb,"shares",t)));
    if(s.exists() && (s.data() || {}).ownerUid && s.data().ownerUid !== uid) return 0;   /* link của shop khác ⇒ không đụng */
    return dnQuet(collection(fdb,"shares",t,"chuky"));
  });
  drNem(kq);
  kq.forEach(x => { if(typeof x === "number") dem += x; });
  return dem;
}
/* Dọn sạch bên trong 1 cửa hàng đã xoá: kho, link hoá đơn, thực đơn QR / link online, đơn & tin nhắn khách */
async function drDonCN(uid, b, r){
  const toks = [];
  const m = dnThat(await getDoc(bdoc(uid, b, "pos_meta", "qr")));
  if(m.exists()){
    const x = m.data() || {};
    for(const t of [x.token, x.onl]) if(typeof t === "string" && t){
      const s = dnThat(await getDoc(doc(fdb,"shares_qr",t)));
      if(s.exists() && (s.data() || {}).ownerUid === uid){ await deleteDoc(s.ref); r.qr++; }
    }
  }
  r.banGhi += await dnQuet(bcol(uid, b, "orders"), d => { const h = (d.data() || {}).hdToken; if(h) toks.push(String(h)); return 0; });
  for(const n of DR_CN) if(n !== "orders") r.banGhi += await dnQuet(bcol(uid, b, n));
  for(const t of toks){
    const s = dnThat(await getDoc(doc(fdb,"shares",t)));
    if(s.exists() && (s.data() || {}).ownerUid && s.data().ownerUid !== uid) continue;
    await dnQuet(collection(fdb,"shares",t,"chuky"));
    if(s.exists()){ await deleteDoc(s.ref); r.link++; }
  }
  r.don += await dnQuet(query(collection(fdb,"qr_don"), where("ownerUid","==",uid), where("chiNhanh","==",b)));
  r.chat += await dnQuet(query(collection(fdb,"qr_chat"), where("ownerUid","==",uid), where("chiNhanh","==",b)), async d => { r.tin += await dnQuet(collection(d.ref,"tin")); return 0; });
  r.cn++;
}
/* Dọn rác 1 shop đang dùng — chỉ xoá rác, KHÔNG đụng sổ sách đang dùng */
async function drDonShop(uid, log){
  const r = { link:0, chat:0, tin:0, don:0, qr:0, cn:0, banGhi:0, ket:0, ncc:0 }, now = Date.now();
  if(!navigator.onLine) throw new Error("mất mạng");
  const sb = dnThat(await getDocs(collection(fdb,"users",uid,"branches")));
  const song = ["main"].concat(sb.docs.map(d => d.id).filter(x => x !== "main"));
  const cs = dnThat(await getDocs(collection(fdb,"users",uid,"customers")));
  const tokK = new Set(); cs.forEach(d => { const t = (d.data() || {}).shareToken; if(t) tokK.add(String(t)); });
  /* 1) link nợ / hoá đơn không còn khách / đơn nào giữ (kèm chữ ký) — đọc theo trang */
  let last = null;
  for(let v = 0; v < 2000; v++){
    const q = query(collection(fdb,"shares"), where("ownerUid","==",uid), ...(last ? [startAfter(last)] : []), limit(DR.TRANG));
    const s = dnThat(await getDocs(q));
    if(s.empty) break;
    const hd = [], mo = [];
    s.docs.forEach(d => {
      const x = d.data() || {};
      if(x.tam === true) mo.push(d);                                                   /* doc tạm app dựng để xoá chữ ký mà chưa kịp gỡ */
      else if(x.kind === "invoice"){ if(!drMoi(x.updatedAt)) hd.push(d); }
      else if(Array.isArray(x.transactions) && !tokK.has(d.id) && !drMoi(x.updatedAt)) mo.push(d);
    });
    if(hd.length){ const con = await drHdSong(uid, song, hd.map(d => d.id)); hd.forEach(d => { if(!con.has(d.id)) mo.push(d); }); }
    for(const d of mo){ await dnQuet(collection(d.ref,"chuky")); await deleteDoc(d.ref); r.link++; }
    if(s.size < DR.TRANG) break;
    last = s.docs[s.docs.length - 1];
  }
  if(r.link) log(`  · ${r.link} link không còn khách / đơn`);
  /* 2) tin nhắn khách cũ */
  const cut = now - DR.CHAT * 864e5, goiY = new Set();
  const ch = dnThat(await getDocs(query(collection(fdb,"qr_chat"), where("ownerUid","==",uid))));
  for(const d of ch.docs){
    const x = d.data() || {}; if(typeof x.chiNhanh === "string" && x.chiNhanh) goiY.add(x.chiNhanh);
    const cuoi = drMs(x.cuoi) || drMs(x.tao), tao = drMs(x.tao) || cuoi;
    if(cuoi && cuoi < cut){
      r.tin += await dnQuet(collection(d.ref,"tin"));
      if(x.chan !== true){ await deleteDoc(d.ref); r.chat++; }                          /* cuộc đã chặn: giữ vỏ để còn chặn */
    }else if(tao && tao < cut){
      r.tin += await dnQuet(query(collection(d.ref,"tin"), where("luc","<",new Date(cut))));
    }
  }
  /* 3) đơn QR / online cũ */
  const qd = dnThat(await getDocs(query(collection(fdb,"qr_don"), where("ownerUid","==",uid))));
  const xd = [];
  qd.forEach(d => { const x = d.data() || {}; if(typeof x.chiNhanh === "string" && x.chiNhanh) goiY.add(x.chiNhanh); if(drNenXoaDon(x, now)) xd.push(d.ref); });
  r.don += await drXoaRef(xd);
  /* 4) cửa hàng đã xoá còn sót dữ liệu bên trong */
  const md = dnThat(await getDoc(doc(fdb,"users",uid,"meta","donRac")));
  const cnXoa = Object.keys((md.exists() && (md.data() || {}).cnXoa) || {});
  const sq = dnThat(await getDocs(query(collection(fdb,"shares_qr"), where("ownerUid","==",uid))));
  sq.forEach(d => { const b = (d.data() || {}).chiNhanh; if(typeof b === "string" && b) goiY.add(b); });
  const sot = await drCnSot(uid, song, cnXoa.concat([...goiY]));
  for(const b of sot){ log(`  · Cửa hàng đã xoá còn dữ liệu: ${b}`); await drDonCN(uid, b, r); }
  if(cnXoa.length){ const x = {}; cnXoa.forEach(b => { x[b] = deleteField(); }); await setDoc(doc(fdb,"users",uid,"meta","donRac"), { cnXoa:x }, { merge:true }); }
  /* 5) két ngành của sản phẩm đã xoá */
  for(const b of song){
    let pids = null;
    for(const n of DR_NGANH){
      const s = dnThat(await getDocs(bcol(uid, b, n)));
      if(s.empty) continue;
      if(!pids){ const p = dnThat(await getDocs(bcol(uid, b, "products"))); pids = new Set(p.docs.map(d => d.id)); }
      r.ket += await drXoaRef(s.docs.filter(d => !pids.has(d.id)).map(d => d.ref));
    }
  }
  /* 6) phiếu trả NCC của NCC đã xoá */
  const sp = dnThat(await getDocs(collection(fdb,"users",uid,"supplier_payments")));
  if(!sp.empty){
    const su = dnThat(await getDocs(collection(fdb,"users",uid,"suppliers")));
    const ids = new Set(su.docs.map(d => d.id));
    r.ncc += await drXoaRef(sp.docs.filter(d => { const s = (d.data() || {}).supplierId; return typeof s === "string" && s && !ids.has(s); }).map(d => d.ref));
  }
  /* ghi sổ */
  const luc = new Date();
  await setDoc(doc(fdb,"accounts",uid), { donRac:{ at:luc, boi:toiLa(), ...r } }, { merge:true });
  (ACC[uid] = ACC[uid] || {}).donRac = { at:luc, ...r };
  const tom = drTom(r);
  if(tom){ await ghiTK(uid, "don_rac_ho", { ghi:tom }); await ghiChung("don_rac_ho", { ghi:`${emailCua(uid) || uid} · ${tom}` }, uid); }
  return r;
}
function drTom(r){
  if(!r) return "";
  const a = [];
  if(r.link) a.push(`${r.link} link`);
  if(r.chat || r.tin) a.push(`${r.chat || 0} cuộc · ${r.tin || 0} tin nhắn`);
  if(r.don) a.push(`${r.don} đơn QR / online`);
  if(r.cn) a.push(`${r.cn} cửa hàng đã xoá (${r.banGhi || 0} bản ghi${r.qr ? ` · ${r.qr} thực đơn QR` : ""})`);
  if(r.ket) a.push(`${r.ket} két ngành`);
  if(r.ncc) a.push(`${r.ncc} phiếu trả NCC`);
  return a.join(" · ");
}
/* Shop đang dùng (có gói nhóm Sổ Nợ, chưa thuộc bảng "Dọn shop đã nghỉ"), chưa dọn lâu nhất lên đầu */
function drDs(){
  const now = Date.now(), toi = (auth.currentUser && auth.currentUser.uid) || "";
  const nghi = new Set();
  try{ const k = dsNghi(); k.du.concat(k.xong).forEach(x => nghi.add(x.uid)); }catch(e){}
  const uids = new Set();
  LIC.forEach(l => { if(l && l.uid && dnLaSono(l.app)) uids.add(l.uid); });
  const out = [];
  uids.forEach(uid => {
    if(uid === toi || String(emailCua(uid) || "").toLowerCase() === CFG.admin || nghi.has(uid)) return;
    const a = ACC[uid] || {}, dr = (a.donRac && typeof a.donRac === "object") ? a.donRac : null, luc = dr ? ngay(dr.at) : null;
    out.push({ uid, email: emailCua(uid) || uid, luc, han: luc ? (now - luc.getTime()) / 864e5 : Infinity });

}

      <b>Không đụng</b>: khách, sổ nợ, hàng, đơn bán, kho, ca, quỹ đang dùng · ảnh (app shop tự dọn).</div>

      : trong("Không có shop nào cần dọn", `Shop đã dọn trong ${DR.NGAY} ngày qua không hiện ở đây`)}</div>

let _drKhoa = false;
async function chayDonRac(t, uids){
  const S = t.S; if(S.dang) return;
  if(_drKhoa || _dnKhoa) return bao("Đang có một lượt dọn — đợi xong đã", 1);
  if(!navigator.onLine) return bao("Không có mạng", 1);
  const ds = [...new Set(uids)].filter(Boolean).slice(0, DR.MOI_LAN);
  if(!ds.length) return bao("Không có shop nào để dọn", 1);
  _drKhoa = true;
  let dongY = false;
  try{
    const tom = ds.slice(0, 8).map(u => "• " + (emailCua(u) || u)).join("\n") + (ds.length > 8 ? `\n• …và ${ds.length - 8} shop nữa` : "");
    dongY = await hoi({ tieuDe:`Dọn rác ${ds.length} shop`, nutOk:"Dọn rác",
      noiDung:`${tom}\n\nChỉ xoá RÁC: link không còn khách / đơn, tin nhắn quá ${DR.CHAT} ngày, đơn QR cũ, dữ liệu của cửa hàng đã xoá, két ngành / phiếu NCC mồ côi.\nKhông đụng khách, sổ nợ, hàng, đơn bán, kho, ca, quỹ đang dùng.` });
  }finally{ if(!dongY) _drKhoa = false; }
  if(!dongY) return;
  const log = m => { try{ drGhiLog(t, m); }catch(e){ console.warn(e); } };
  const tong = { link:0, chat:0, tin:0, don:0, qr:0, cn:0, banGhi:0, ket:0, ncc:0 };
  let xong = 0, hong = 0;
  try{
    S.dang = true; S.log = ""; try{ veDonRac(t); }catch(e){ console.warn(e); }
    for(const uid of ds){
      log(`• ${emailCua(uid) || uid}`);
      try{
        const r = await drDonShop(uid, log);
        xong++; Object.keys(tong).forEach(k => { tong[k] += r[k] || 0; });
        log(`  ✓ ${drTom(r) || "sạch — không có rác"}`);
      }catch(e){
        hong++; log(`  ❌ ${dnLoi(e)}`);
        if(!navigator.onLine){ log("⛔ Dừng: mất mạng."); break; }
      }
    }
    log(`\n${hong ? "⚠️" : "✅"} Xong ${xong}/${ds.length} shop${drTom(tong) ? " · " + drTom(tong) : " · không có rác"}${hong ? ` · ${hong} shop lỗi (bấm Dọn lại)` : ""}`);
    bao(hong ? `Dọn xong ${xong} shop, ${hong} shop lỗi` : `Đã dọn rác ${xong} shop`, hong > 0);
  }finally{
    S.dang = false; _drKhoa = false;
    try{ if(TAM.includes(t)) veDonRac(t); }catch(e){ console.warn(e); }
    try{ veView(VIEW); }catch(e){}
  }
}

/* ══════════════════════════ [3.3] NGHE ĐƠN TRỰC TIẾP ══════════════════════════
   Khách mở màn thanh toán / bấm "Đã chuyển khoản" là bảng này biết NGAY — không phải bấm Tải lại.
   Chỉ tin số từ MÁY CHỦ (bỏ qua lượt từ bộ đệm). Listener chết (mất mạng lâu, mất quyền) ⇒ tự nối lại,
   chờ tăng dần tối đa 60 giây — không bao giờ treo im mà mình không biết. */
const DN_IM = 14;   /* khách trả tiền mà quá chừng này ngày không mở app = sắp bỏ */
let _ngheReq = null, _ngheLan = 0, _ngheHen = 0;
function tatNgheDon(){ clearTimeout(_ngheHen); try{ if(_ngheReq) _ngheReq(); }catch(e){} _ngheReq = null; }
function ngheDon(){

      if(!snap || (snap.metadata && snap.metadata.fromCache)) return;

      const moiDs = snap.docs.map(d => { const x = d.data() || {}, p = d.id.split("__");
        return { ...x, id:d.id, _uid: x.uid || p[0], _app: x.app || p[1] || "" }; });
      const moi = [], ck = [];
      moiDs.forEach(r => { if(!rCho(r)) return; const o = cu.get(r.id);
        if(!o || !rCho(o)) (coCK(r) ? ck : moi).push(r);
        else if(coCK(r) && !coCK(o)) ck.push(r); });
      REQ = moiDs; locEmailDon(); donCu();

      veHuyHieu();

      if(!TAM.length && !dangGo) veView(VIEW);
      if(ck.length){ const r = ck[0];
        bao(`💸 ${r.email || emailCua(r._uid) || r._uid} vừa báo ĐÃ chuyển ${tienD(r.ck.tien != null ? r.ck.tien : r.amount)} · ${tenApp(r._app)}${ck.length > 1 ? ` (+${ck.length - 1} đơn nữa)` : ""}`);
        try{ navigator.vibrate && navigator.vibrate([120, 60, 120]); }catch(e){} }
      else if(moi.length) bao(`🔔 ${moi.length} đơn mới: ${moi.slice(0,3).map(r => tenApp(r._app)).join(", ")}${moi.length > 3 ? "…" : ""}`);
    }, err => {
      console.warn("nghe đơn:", err); _ngheReq = null;
      if(!auth.currentUser) return;

/* ══════════════════════════ [3.6] RADAR “HAI LẦN THU CÙNG GÓI” — NÚT ĐÃ ĐỐI CHIẾU ══════════════════════════
   Soát sao kê xong (đủ 2 khoản tiền về, hoặc đã ghi dòng điều chỉnh + đặt lại hạn) → bấm “Đã đối chiếu”:
   cặp đó thôi tính vào radar. Dấu ghi vào kho audit (chỉ tạo, không sửa xoá được) nên mọi máy đều thấy và
   luôn còn dấu vết ai đối chiếu, lúc nào. Bấm nhầm → “Mở lại” (ghi thêm 1 dòng, không xoá dòng cũ).
   Khoá 1 cặp = mã dòng thu SAU ~ mã dòng thu TRƯỚC, nằm cuối ô ghi: "<mô tả> · #<khoá>".                    */
function dcKhoaCap(sau, truoc){ return String(sau.id) + "~" + String(truoc.id); }
function dcKhoaGhi(ghi){ const m = /#([^\s#~]+~[^\s#~]+)$/.exec(String(ghi || "")); return m ? m[1] : ""; }
function dcMoTaGhi(ghi){ return String(ghi || "").replace(/ · #[^\s#~]+~[^\s#~]+$/, ""); }
/* khoá → dòng nhật ký MỚI NHẤT của cặp đó (đối chiếu hay mở lại) */
function dcTrangThai(){
  const m = new Map();
  try{
    const co = new Set(DC_LOG.map(x => x && x.id));
    DC_LOG.concat(DC_MOI.filter(x => !co.has(x.id)))
      .filter(x => x && DC_VIEC.includes(x.viec))
      .map((x, i) => ({ x, i, t: +(ngay(x.at) || 0) }))
      .sort((a, b) => (a.t - b.t) || (a.i - b.i))
      .forEach(({ x }) => { const k = dcKhoaGhi(x.ghi); if(k) m.set(k, x); });
  }catch(e){ console.warn("đối chiếu thu trùng:", e); }
  return m;
}
function dcDaDoiChieu(){
  const s = new Set();
  dcTrangThai().forEach((x, k) => { if(x.viec === "doi_chieu_thu") s.add(k); });
  return s;
}

  if(!navigator.onLine) throw new Error("Không có mạng — chưa ghi được");
  const e = sach({ ...buoc(viec, { ghi: `${String(moTa || "").slice(0, 200)} · #${k}` }), uid: uid || "", app: app || "" });
  const ref = await addDoc(collection(fdb,"audit"), e);
  const x = { ...e, id: ref.id };
  DC_MOI.push(x); AUD.unshift(x);
  return x;
}

      <span class="gi"><span class="t" style="display:block">${esc(tieu)}</span>${d1 ? `<span class="d" style="display:block">${esc(d1)}</span>` : ""}${d2 ? `<span class="d" style="display:block">${esc(d2)}</span>` : ""}</span>
      <span class="hang-nut" style="width:100%;margin-top:8px">${uid ? `<button class="nut nho" data-act="mo-khach" data-uid="${esc(uid)}">Hồ sơ</button>` : ""}${nut}</span></div>`;
  t.datTieuDe(x.ten);
  t.than.innerHTML = (cho.length
      ? `<div class="bao canh">${esc(x.mota)}<br>Soát xong — sao kê có đủ 2 khoản tiền về, hoặc đã sửa (dòng điều chỉnh + đặt lại hạn) — thì bấm <b>Đã đối chiếu</b>: cặp đó thôi tính vào radar.</div>
    <div class="nhom">${cho.slice(0, 200).map(i => dong(i.t, i.d, "", i.uid,
        `<button class="nut nho chinh" data-act="doi-chieu-thu" data-k="${esc(i.k)}">Đã đối chiếu</button>`)).join("")}</div>

const SS_LOAI = [["khach","Khách nợ"],["hang","Hàng hoá"],["don","Đơn bán"]];

/* ─────────── Hộp thư thật của 1 email: Gmail bỏ dấu chấm và phần sau dấu + ─────────── */
function hopThu(e){
  e = String(e || "").trim().toLowerCase();
  const at = e.lastIndexOf("@"); if(at < 1) return "";
  let ten = e.slice(0, at), mien = e.slice(at + 1);
  if(mien === "googlemail.com") mien = "gmail.com";
  const cong = ten.indexOf("+"); if(cong >= 0) ten = ten.slice(0, cong);
  if(mien === "gmail.com") ten = ten.replace(/\./g, "");
  return ten && mien ? ten + "@" + mien : "";
}
function tomTatUid(u){
  const T = LIC.filter(l => l.uid === u).map(l => tt(l).ma), dem = m => T.filter(x => x === m).length, p = [];
  if(dem("tra")) p.push(`${dem("tra")} gói đang trả`);
  if(dem("vv")) p.push(`${dem("vv")} vĩnh viễn`);
  if(dem("thu")) p.push(`${dem("thu")} dùng thử`);
  if(dem("het")) p.push(`${dem("het")} hết hạn`);
  if(dem("khoa")) p.push(`${dem("khoa")} bị khoá`);
  return p.join(", ") || "chưa có giấy phép";
}
/* Gom tài khoản theo hộp thư thật — chỉ nhóm có người từng dùng thử. Nhớ theo lần nạp số liệu (radar gọi nhiều lần). */
let _nhomHT = { k:"", v:[] };
function nhomHopThu(){
  const khoa = LUC_NAP + "|" + LIC.length + "|" + Object.keys(ACC).length + "|" + Object.keys(SGN).length;
  if(_nhomHT.k === khoa) return _nhomHT.v;
  const mail = {}, nap1 = (u, e) => { if(u && e && !mail[u]) mail[u] = String(e); };
  Object.keys(ACC).forEach(u => nap1(u, (ACC[u] || {}).email)); Object.keys(SGN).forEach(u => nap1(u, (SGN[u] || {}).email));
  LIC.forEach(l => nap1(l.uid, l.email)); PAY.forEach(p => nap1(p.uid, p.email)); REQ.forEach(r => nap1(r._uid, r.email));
  const toi = (auth.currentUser && auth.currentUser.uid) || "", m = {};
  Object.keys(mail).forEach(u => { if(u === toi || mail[u].trim().toLowerCase() === CFG.admin) return;
    const h = hopThu(mail[u]); if(h) (m[h] = m[h] || []).push(u); });
  const thu = new Set(LIC.filter(l => l.trial === true).map(l => l.uid));
  const v = Object.keys(m).filter(h => m[h].length >= 2).map(h => ({ hop:h, uids:m[h], thu: m[h].filter(u => thu.has(u)).length }))
    .filter(x => x.thu >= 1).sort((a,b) => (b.thu - a.thu) || (b.uids.length - a.uids.length));
  _nhomHT = { k:khoa, v };
  return v;
}
/* Gom tài khoản theo MÃ MÁY: cùng mã máy, hoặc có tên trong danh sách "tài khoản khác trên máy này" */
function nhomMay(rows){
  const cha = {};
  const goc = x => { while(cha[x] !== x) x = cha[x]; return x; };
  const noi = (a, b) => { if(!(a in cha)) cha[a] = a; if(!(b in cha)) cha[b] = b; const ra = goc(a), rb = goc(b); if(ra !== rb) cha[ra] = rb; };
  (rows || []).forEach(r => { const m = r && r.m; if(!m || typeof m.dev !== "string" || !m.dev) return;
    const d = "d:" + m.dev.slice(0, 40); noi(d, "u:" + r.uid);
    (Array.isArray(m.devUids) ? m.devUids : []).slice(0, 12).forEach(u => { if(typeof u === "string" && u) noi(d, "u:" + u); }); });
  const g = {};
  Object.keys(cha).forEach(x => { if(x.indexOf("u:") !== 0) return; const r = goc(x); (g[r] = g[r] || new Set()).add(x.slice(2)); });
  const toi = (auth.currentUser && auth.currentUser.uid) || "";
  return Object.values(g).map(s => [...s].filter(u => u !== toi && String(emailCua(u)).toLowerCase() !== CFG.admin)).filter(a => a.length >= 2);
}

}
