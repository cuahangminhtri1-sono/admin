:root{
  --giay:#eef3f1; --mat:#ffffff; --mat2:#f6f9f8; --muc:#0f2a26; --muc2:#56706a; --muc3:#86a09a;
  --vach:#d8e3df; --ngoc:#0e6b69; --ngoc2:#0a5553; --ngocnhat:#e2f1ef;
  --ket:#0a5553; --chu-ngoc:#ffffff;
  --dong:#b8641f; --dongnhat:#fbeee2; --do:#c2372b; --donhat:#fbe6e3; --la:#1f8a4c; --lanhat:#e3f4ea;
  --bong:0 1px 2px rgba(15,42,38,.06),0 6px 18px rgba(15,42,38,.07);
  --r1:10px; --r2:14px; --r3:20px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --giay:#0b1614; --mat:#12201e; --mat2:#172725; --muc:#e3eeea; --muc2:#93aba5; --muc3:#6b8580;
    --vach:#223532; --ngoc:#3fb4ac; --ngoc2:#5cc9c1; --ngocnhat:#123a37;
    --ket:#0f4a46; --chu-ngoc:#04201e;
    --dong:#e39152; --dongnhat:#3a2616; --do:#ff6b5e; --donhat:#3d1a17; --la:#4cc37e; --lanhat:#143321;

    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--giay);color:var(--muc);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ngoc);outline-offset:2px;border-radius:6px}
.so{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.an{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── khung ── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--giay) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.cuon{border-bottom-color:var(--vach)}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muc2);letter-spacing:0}
.dongbo{width:9px;height:9px;border-radius:50%;background:var(--muc3);flex:none}
.dongbo.ok{background:var(--la)} .dongbo.dang{background:var(--dong);animation:nhap 1s infinite alternate} .dongbo.loi{background:var(--do)}
@keyframes nhap{to{opacity:.35}}
.nut-tron{width:40px;height:40px;border-radius:12px;border:1px solid var(--vach);background:var(--mat);display:grid;place-items:center;flex:none}
.nut-tron svg{width:19px;height:19px}
main{max-width:760px;margin:0 auto;padding:6px 16px 20px}
.view{display:none}.view.on{display:block}

   hoi({tieuDe, noiDung, nutOk, nguy, go:'CHUYEN'}) → true/false
   nhap({tieuDe, noiDung, macDinh}) → chuỗi / null                               */
function hopHoi({ tieuDe="Xác nhận", noiDung="", nutOk="Đồng ý", nutHuy="Huỷ", nguy=false, go=null, oNhap=false, macDinh="", kieu="text" }){
  return new Promise(res => {
    const n = document.createElement("div"); n.className = "hop-nen";
    n.innerHTML = `<div class="hop" role="alertdialog" aria-modal="true"><h4></h4><div class="nd"></div>
      ${(go || oNhap) ? `<label class="o-nhap" style="margin:14px 0 0"><span></span><input autocomplete="off" spellcheck="false"></label>` : ""}
      <div class="hang-nut"><button class="nut" data-k="huy"></button><button class="nut ${nguy ? "nguy dac" : "chinh"}" data-k="ok"></button></div></div>`;
    n.querySelector("h4").textContent = tieuDe;
    n.querySelector(".nd").textContent = noiDung;
    n.querySelector('[data-k="huy"]').textContent = nutHuy;
    n.querySelector('[data-k="ok"]').textContent = nutOk;
    const inp = n.querySelector("input");
    if(inp){
      n.querySelector(".o-nhap span").textContent = go ? `Gõ đúng chữ ${go} để xác nhận` : "";
      if(!go){ inp.value = macDinh; inp.type = kieu; }
    }
    document.body.appendChild(n);
    const xong = v => { n.remove(); document.removeEventListener("keydown", phim, true); res(v); };
    const ok = () => {
      if(go) return xong(String(inp.value||"").trim().toUpperCase() === String(go).toUpperCase());
      if(oNhap) return xong(inp.value);
      xong(true);
    };
    const phim = e => { if(e.key === "Escape"){ e.stopPropagation(); xong(oNhap ? null : false); }
                        if(e.key === "Enter" && inp && document.activeElement === inp){ e.preventDefault(); ok(); } };
    document.addEventListener("keydown", phim, true);
    n.addEventListener("click", e => {
      const k = e.target.closest("[data-k]"); if(!k) return;
      if(k.dataset.k === "huy") xong(oNhap ? null : false); else ok();
    });
    setTimeout(()=>{ (inp || n.querySelector('[data-k="ok"]')).focus(); }, 30);
  });
}
const hoi  = o => hopHoi(o);

async function chay(btn, fn, chuDang="Đang làm…"){
  if(btn && btn.disabled) return;
  const cu = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.textContent = chuDang; }
  try{ return await fn(); }
  catch(e){ console.warn(e); bao("Lỗi: " + maLoi(e) + (e && e.code === "permission-denied" ? " — Rules chưa cho phép" : ""), 1); }
  finally{ if(btn && btn.isConnected){ btn.disabled = false; btn.innerHTML = cu; } }
}

      return { ...x, id: d.id, _uid: x.uid || p[0], _app: x.app || p[1] || "" }; });
    PAY = gp.docs.map(d => ({ ...(d.data()||{}), id: d.id }));
    AUD = (gd ? gd.docs : []).map(d => ({ ...(d.data()||{}), id: d.id }));
    ERR = (ge ? ge.docs : []).map(d => ({ ...(d.data()||{}), id: d.id }));
    SGN = {}; (gs ? gs.docs : []).forEach(d => { SGN[d.id] = d.data() || {}; });
    REF = {}; (gf ? gf.docs : []).forEach(d => { REF[d.id] = d.data() || {}; });
    CFGDB = cf.exists() ? (cf.data()||{}) : {};
    BILL  = gg.exists() ? (gg.data()||{}) : {};
    apCauHinh();
    donCu();
    DA_NAP = true; LUC_NAP = Date.now();
    datDongBo("ok");
  })();
  try{ await _dangNap; }
  catch(e){ datDongBo("loi"); throw e; }
  finally{ _dangNap = null; }
}

/* Đơn POS đời cũ: app cũ bật cờ accounts/{uid}.posRequested — dựng lại thành đơn chờ */
function donCu(){
  Object.keys(ACC).forEach(u => {
    const a = ACC[u] || {};
    if(a.posRequested !== true) return;
    if(REQ.some(r => r._uid === u && r._app === "sono_pos" && rCho(r))) return;
    REQ.push({ id:`${u}__sono_pos`, _cu:true, _uid:u, _app:"sono_pos", uid:u, app:"sono_pos",
      email: a.posReqEmail || a.email || "", months: num(a.posReqMonths) || 1,
      amount: num(a.posReqAmount) || giaCua(u, "sono_pos"), requestedAt: a.posRequestedAt || null,
      status:"pending", noiDung: (a.posReqEmail || a.email || "") + " POS" });
  });
}

/* ĐƠN CÒN CHỜ — gộp đúng cả 2 cờ:
   • status   : cờ chung của 6 app
   • ngStatus : cờ riêng gói ngành. Đơn ngành cũ có thể mang status:'done' mà ngStatus còn 'pending'
     và CHƯA ai duyệt (handledAt trống) ⇒ vẫn là đơn chờ thật. */
const rCho = r => (r.status ?? "pending") !== "done" || (r.ngStatus === "pending" && !r.handledAt);
const rNgay = r => ngay(r.requestedAt ?? r.tao);
const pNgay = p => ngay(p.at ?? p.ngayTra);
const pTien = p => num(p.amount ?? p.soTien);
const pThang = p => num(p.months ?? p.soThang);

const licCua  = (uid, app) => LIC.find(l => l.uid === uid && l.app === app) || null;
const licsCua = uid => LIC.filter(l => l.uid === uid);
function emailCua(uid){
  return (ACC[uid] && ACC[uid].email) || (SGN[uid] && SGN[uid].email)
    || (LIC.find(l => l.uid === uid && l.email) || {}).email
    || (PAY.find(p => p.uid === uid && p.email) || {}).email
    || (REQ.find(r => r._uid === uid && r.email) || {}).email || "";
}

/* TRẠNG THÁI GIẤY PHÉP — đúng THỨ FIRESTORE RULES XÉT (conHan):
   khoá > vĩnh viễn (vinhVien:true là qua, bất kể ngày) > còn hạn > hết hạn > chưa đặt hạn */
function tt(l){
  if(!l) return { ma:"chua", ten:"Chưa cấp", lop:"" };
  if(l.active === false) return { ma:"khoa", ten:"Đang khoá", lop:"xau" };
  const h = hanRules(l.paidUntil);
  if(l.vinhVien === true) return { ma:"vv", ten:"Vĩnh viễn", lop:"ok", lai: h != null };
  if(h == null){
    if(l.paidUntil != null && l.paidUntil !== "") return { ma:"sai", ten:"Hạn sai kiểu", lop:"xau" };
    return { ma:"trong", ten:"Chưa đặt hạn", lop:"xau" };
  }
  const d = new Date(h), con = soNgay(d);
  if(h <= Date.now()){ const qua = -con; return { ma:"het", ten: qua <= 0 ? "Hết hạn hôm nay" : `Hết hạn ${qua} ngày`, lop:"xau", con, han:d }; }
  if(l.trial === true) return { ma:"thu", ten: con === 0 ? "Dùng thử, hết hôm nay" : `Dùng thử, còn ${con} ngày`, lop:"canh", con, han:d };
  return { ma:"tra", ten: con === 0 ? "Hết hạn hôm nay" : `Còn ${con} ngày`, lop: con <= 7 ? "canh" : "ok", con, han:d };
}
const conHan = l => ["vv","tra","thu"].includes(tt(l).ma);
const suatCua = l => laCN(l && l.app) ? Math.max(1, Math.floor(num(l.qty)) || 1) : 1;

/* ─────────── GOM THEO KHÁCH ─────────── */
function khach(){
  const m = {};
  const lay = uid => (m[uid] = m[uid] || { uid, lic:[], pay:[], req:[] });
  Object.keys(ACC).forEach(lay); Object.keys(SGN).forEach(lay);
  LIC.forEach(l => lay(l.uid).lic.push(l));
  PAY.forEach(p => { if(p.uid) lay(p.uid).pay.push(p); });
  REQ.forEach(r => { if(r._uid) lay(r._uid).req.push(r); });
  return Object.values(m).map(k => {
    k.email = emailCua(k.uid);
    k.a = ACC[k.uid] || {};
    k.tongTra = k.pay.reduce((s,p) => s + pTien(p), 0);
    k.lanCuoi = k.pay.map(pNgay).filter(Boolean).sort((a,b) => b-a)[0] || null;
    k.tao = ngay(k.a.createdAt) || ngay((SGN[k.uid]||{}).createdAt);
    const T = k.lic.map(l => ({ l, t: tt(l) }));
    k.T = T;
    k.dangTra = T.filter(x => x.t.ma === "tra").length;
    k.vv      = T.filter(x => x.t.ma === "vv").length;
    k.thu     = T.filter(x => x.t.ma === "thu").length;
    k.het     = T.filter(x => x.t.ma === "het").length;
    k.khoa    = T.filter(x => x.t.ma === "khoa").length;
    k.loiHan  = T.filter(x => x.t.ma === "trong" || x.t.ma === "sai").length;
    const sap = T.filter(x => x.t.ma === "tra" && x.t.con <= 7).map(x => x.t.con);
    k.sapHet  = sap.length ? Math.min(...sap) : null;
    k.cho     = k.req.filter(rCho).length;
    return k;
  });
}
function tomTat(k){
  const p = [];
  if(k.dangTra) p.push(`${k.dangTra} gói đang trả`);
  if(k.vv) p.push(`${k.vv} vĩnh viễn`);
  if(k.thu) p.push(`${k.thu} dùng thử`);
  if(k.het) p.push(`${k.het} hết hạn`);
  if(k.khoa) p.push(`${k.khoa} bị khoá`);
  if(!p.length) p.push(k.lic.length ? "chưa có gói còn hạn" : "chưa có giấy phép");
  return p.join(", ");
}

/* ─────────── CHỈ SỐ TIỀN ─────────── */
function chiSo(){
  const th = hnay().slice(0,7);
  const d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth()-1);
  const truoc = `${d0.getFullYear()}-${pad2(d0.getMonth()+1)}`;
  const thuThang = PAY.filter(p => thangCua(pNgay(p)) === th).reduce((s,p) => s + pTien(p), 0);
  const thuTruoc = PAY.filter(p => thangCua(pNgay(p)) === truoc).reduce((s,p) => s + pTien(p), 0);
  const homNay = PAY.filter(p => dToS(pNgay(p)) === hnay()).reduce((s,p) => s + pTien(p), 0);
  const tongThu = PAY.reduce((s,p) => s + pTien(p), 0);
  const licTra = LIC.filter(l => tt(l).ma === "tra");
  const mrr = licTra.reduce((s,l) => s + giaCua(l.uid, l.app) * suatCua(l), 0);
  const uidTra = new Set(licTra.map(l => l.uid));
  const uidTungTra = new Set(PAY.filter(p => pTien(p) > 0 && p.uid).map(p => p.uid));
  const conGiu = [...uidTungTra].filter(u => uidTra.has(u) || LIC.some(l => l.uid === u && tt(l).ma === "vv")).length;
  const giuChan = uidTungTra.size ? Math.round(conGiu / uidTungTra.size * 100) : 0;
  /* Dự báo 30 ngày: gói trả tiền sắp hết × giá × tỉ lệ giữ chân (ước tính) */
  const sap30 = licTra.filter(l => { const t = tt(l); return t.con != null && t.con <= 30; });
  const duBao = Math.round(sap30.reduce((s,l) => s + giaCua(l.uid, l.app) * suatCua(l), 0) * (giuChan/100));
  const moiThang = [...uidTungTra].filter(u => {
    const d = PAY.filter(p => p.uid === u && pTien(p) > 0).map(pNgay).filter(Boolean).sort((a,b) => a-b)[0];
    return d && thangCua(d) === th; }).length;
  return { th, truoc, thuThang, thuTruoc, homNay, tongThu, mrr, khachTra: uidTra.size,
    arpu: uidTra.size ? Math.round(mrr/uidTra.size) : 0, giuChan, duBao, sap30: sap30.length, moiThang,
    dungThu: LIC.filter(l => tt(l).ma === "thu").length, donCho: REQ.filter(rCho).length };
}

/* ─────────── ĐƠN CHỜ + TỰ SOÁT ───────────
   Mỗi đơn tự đối chiếu: bảng giá · lần thu gần nhất cùng gói · khách mới · thưởng giới thiệu */
function donCho(){
  return REQ.filter(rCho).map(r => {
    const uid = r._uid, app = r._app;
    const biet = CFG.apps.includes(app);
    /* [3.1] ck = lúc khách bấm "Tôi đã chuyển khoản" + đúng số tháng/suất/tiền đã chọn khi chuyển.
       Đơn KHÔNG có ck chỉ nghĩa là khách đã MỞ màn thanh toán — chưa chắc đã trả tiền. */
    const ck = (r.ck && typeof r.ck === "object") ? r.ck : null;
    const m = num((ck && ck.thang) || r.months) || 1;
    const sl = laCN(app) ? Math.min(50, Math.max(1, Math.floor(num((ck && ck.sl) || r.qty)) || 1)) : 1;
    const khai = num(ck && ck.tien != null ? ck.tien : (r.amount ?? r.soTien));
    const donGia = biet ? giaCua(uid, app) : 0;
    const chuan = giaGiaHan(donGia, m) * sl;
    const co = [];
    if(!biet) co.push({ lop:"xau", t:"Không rõ gói — chọn gói khi duyệt" });
    else if(donGia <= 0) co.push({ lop:"canh", t:"Gói này chưa đặt giá" });
    else if(khai === chuan) co.push({ lop:"ok", t: giaRieng(uid, app) ? "Khớp giá riêng của khách" : "Khớp bảng giá" });
    else if(khai < chuan) co.push({ lop:"canh", t:`Khai thiếu ${tienD(chuan - khai)}` });
    else co.push({ lop:"", t:`Khai dư ${tienD(khai - chuan)}` });
    const vua = PAY.filter(p => p.uid === uid && p.app === app && pTien(p) > 0 && pNgay(p) && (Date.now() - pNgay(p)) < 3*864e5)
                   .sort((a,b) => pNgay(b) - pNgay(a))[0];
    if(vua) co.push({ lop:"xau", t:`Đã thu gói này ${lauRoi(pNgay(vua))} (${tienD(pTien(vua))}) — coi chừng duyệt 2 lần` });
    if(!PAY.some(p => p.uid === uid && pTien(p) > 0)) co.push({ lop:"ngoc", t:"Khách trả tiền lần đầu" });
    const rf = REF[uid];
    if(m >= 12 && rf && rf.referredByUid && rf.appJoined === app) co.push({ lop:"ngoc", t:"Duyệt xong tự thưởng 1 tháng cho người giới thiệu" });
    const d = rNgay(r), cho = d ? -soNgay(d) : null;
    if(cho != null && cho >= 2) co.push({ lop:"canh", t:`Đã chờ ${cho} ngày` });
    if(ck) co.unshift({ lop:"ok", t:`💸 Khách báo ĐÃ chuyển khoản${ngay(ck.luc) ? " " + lauRoi(ck.luc) : ""}` });
    /* [3.1.1] MẠO DANH: tài khoản A ghi đơn mang email của khách B ⇒ tiền B chuyển bị duyệt nhầm cho A.
       Email trên đơn phải trùng email của chính tài khoản đó (hồ sơ / đăng ký). */
    const mTk = String((ACC[uid] || {}).email || (SGN[uid] || {}).email || "").trim().toLowerCase();
    const mDon = String(r.email || "").trim().toLowerCase();
    const giaMao = !!(mDon && mTk && mDon !== mTk);
    if(giaMao) co.unshift({ lop:"xau", t:`Email trên đơn (${mDon}) KHÁC email tài khoản (${mTk}) — coi chừng mạo danh` });
    else co.push({ lop:"", t:"Khách chưa bấm “Đã chuyển khoản” — soát sao kê trước khi duyệt" });
    return { r, uid, app, biet, m, sl, khai, chuan, co, d, lech: biet && donGia > 0 && khai !== chuan,
             nguy: !!vua || !biet || giaMao, email: r.email || emailCua(uid), daBao: !!ck };
  }).sort((a,b) => (b.daBao - a.daBao) || ((b.d || 0) - (a.d || 0)));
}

/* ─────────── NHÓM KHÁCH CẦN CHĂM ─────────── */
const vuaNhac = uid => { const m = ((ACC[uid]||{}).remote||{}).msg;
  return !!(m && String(m.id||"").charAt(0) === "n" && ngay(m.at) && (Date.now() - ngay(m.at)) < 3*864e5); };
function nhomCham(loai){
  const theo = {};
  LIC.forEach(l => {
    const t = tt(l); let hop = false;
    if(loai === "sap") hop = t.ma === "tra" && t.con <= 7;
    else if(loai === "thu") hop = t.ma === "thu" && t.con <= 3;
    else if(loai === "rot") hop = t.ma === "het" && l.trial !== true && t.con >= -30;
    if(!hop) return;
    (theo[l.uid] = theo[l.uid] || []).push({ l, t });
  });
  return Object.keys(theo).map(uid => {
    const ds = theo[uid].sort((a,b) => (a.t.con ?? 0) - (b.t.con ?? 0));
    /* Kênh tin từ xa hiện chỉ có trong app Sổ Nợ + Bán hàng */
    return { uid, email: emailCua(uid), ds, con: ds[0].t.con, han: ds[0].t.han, nhac: vuaNhac(uid),
             nhan: LIC.some(x => x.uid === uid && String(x.app).indexOf("sono") === 0) };
  }).sort((a,b) => (a.con ?? 0) - (b.con ?? 0));
}

/* ─────────── RADAR THẤT THOÁT (tức thì, từ dữ liệu đã nạp) ─────────── */
function radar(){
  const R = [];
  const them = (muc, ma, ten, mota, items, hanhDong) => R.push({ muc, ma, ten, mota, items: items || [], hanhDong });
  const sw = k => CFGDB[k];

  if(sw("enforceCn") !== true) them("nang","enforceCn","Thu phí chi nhánh đang tắt","Cửa hàng thứ hai trở đi đang chạy miễn phí. Quét chi nhánh, miễn trừ khách cũ rồi bật.",[{t:"Công tắc enforceCn = tắt"}],"quet-cn");
  if(sw("enforceNganh") !== true) them("nang","enforceNganh","Thu phí gói ngành đang tắt","Bàn F&B, biến thể thời trang, phòng giờ, bậc giá đang dùng miễn phí khi hết hạn gói ngành.",[{t:"Công tắc enforceNganh = tắt"}],"quet-cn");
  if(sw("cnChung") !== false) them("vua","cnChung","Gói chi nhánh chung đang mở cho mọi ngành","1 suất sono_cn dùng được ở cả 5 ngành. Muốn thu đủ từng ngành thì tắt công tắc này (sau khi quét).",[{t:"Công tắc cnChung = bật"}],"cong-tac");

  /* [3.1] Gói CHƯA ĐẶT GIÁ: app khách hiện "liên hệ giá" — không mã QR, không ghi đơn ⇒ mất doanh thu âm thầm */

    "App khách hiện “liên hệ giá”: không có mã QR, không ghi đơn ⇒ khách muốn trả tiền cũng không trả được. Đặt giá ở Cài đặt → Bảng giá (cố ý chưa bán gói nào thì bỏ qua gói đó).",
    chuaBan.map(a => ({ t: tenApp(a), d: `ô ${CFG.oGia[a][0]} đang trống` })), "bang-gia");

  const tn = LIC.filter(l => ["trong","sai"].includes(tt(l).ma));
  them("nang","trongHan","Giấy phép thiếu hạn — khách đang bị chặn oan",
    "Không có ngày hết hạn và không đánh dấu vĩnh viễn: app khách tưởng còn dùng được nhưng máy chủ chặn. Đặt hạn hoặc sửa hàng loạt thành vĩnh viễn.",
    tn.map(l => ({ uid:l.uid, t:emailCua(l.uid)||l.uid, d:`${tenApp(l.app)} · ${tt(l).ten}` })), "sua-vv");

  const cham = REQ.filter(r => rCho(r) && rNgay(r) && -soNgay(rNgay(r)) >= 2);
  them("nang","choLau","Đơn chờ quá 2 ngày","Khách đã chuyển khoản mà chưa được mở — để lâu là mất khách.",
    cham.map(r => ({ uid:r._uid, t:r.email||emailCua(r._uid)||r._uid, d:`${tenApp(r._app)} · ${tienD(r.amount)} · chờ ${-soNgay(rNgay(r))} ngày` })));

  const trung = [];
  const tp = PAY.filter(p => pTien(p) > 0 && p.uid && p.app && !p.dieuChinh && pNgay(p)).sort((a,b) => pNgay(a) - pNgay(b));
  for(let i = 1; i < tp.length; i++){
    for(let j = i-1; j >= 0 && (pNgay(tp[i]) - pNgay(tp[j])) < 3*864e5; j--){

        trung.push({ uid:tp[i].uid, t:tp[i].email||emailCua(tp[i].uid)||tp[i].uid,
          d:`${tenApp(tp[i].app)} · thu ${tienD(pTien(tp[j]))} lúc ${gioVN(pNgay(tp[j]))} rồi ${tienD(pTien(tp[i]))} lúc ${gioVN(pNgay(tp[i]))}` });

      }

  }
  them("vua","thuTrung","Hai lần thu cùng gói trong 3 ngày","Có thể đã duyệt trùng một khoản chuyển khoản (khách được cộng hạn 2 lần). Đối chiếu sao kê.", trung);

  const lai = LIC.filter(l => tt(l).ma === "vv" && tt(l).lai);
  them("vua","lai","Vừa vĩnh viễn vừa có ngày hết hạn","Máy chủ đang tính là VĨNH VIỄN. Chọn giữ một kiểu cho sổ sạch.",
    lai.map(l => ({ uid:l.uid, t:emailCua(l.uid)||l.uid, d:`${tenApp(l.app)} · ngày ghi ${ngayVN(l.paidUntil)}` })));

  const dai = LIC.filter(l => { const t = tt(l); return t.ma === "tra" && t.con > 400; });

    dai.map(l => ({ uid:l.uid, t:emailCua(l.uid)||l.uid, d:`${tenApp(l.app)} · tới ${ngayVN(l.paidUntil)}` })));

  const la = LIC.filter(l => !CFG.apps.includes(l.app));
  them("vua","la","Giấy phép mã lạ","Không thuộc sản phẩm nào đang bán.", la.map(l => ({ uid:l.uid, t:emailCua(l.uid)||l.uid, d:`Mã: ${l.app}` })));

  const khongSo = LIC.filter(l => tt(l).ma === "tra" && !PAY.some(p => p.uid === l.uid && p.app === l.app)
    && !(l.lichSu||[]).some(e => /nhan_chuyen|thuong/.test(String(e && e.viec || ""))));
  them("nhe","khongSo","Đang có hạn trả tiền nhưng sổ không có dòng thu","Gia hạn tay ngoài sổ, thưởng giới thiệu, hoặc sót ghi. Soát lại cho sổ khớp.",
    khongSo.map(l => ({ uid:l.uid, t:emailCua(l.uid)||l.uid, d:`${tenApp(l.app)} · hạn ${ngayVN(l.paidUntil)}` })));

  const thuMoi = {};
  LIC.forEach(l => { if(l.trial !== true) return; const d = ngay(l.startedAt); if(!d || (Date.now() - d) > 14*864e5) return;
    const k = dToS(d); (thuMoi[k] = thuMoi[k] || new Set()).add(l.uid); });
  const ngayDong = Object.keys(thuMoi).filter(k => thuMoi[k].size >= 5).sort().reverse();
  them(ngayDong.length ? "nang" : "nhe","thuLoat","Tài khoản dùng thử mọc hàng loạt",
    "Một ngày có từ 5 tài khoản mới mở dùng thử là dấu hiệu lập nick ăn dùng thử. Có thể tắt Cho dùng thử trong Cài đặt.",

  /* Giới thiệu bạn bè: vòng tròn, gắn muộn, người giới thiệu ma, giới thiệu hàng loạt */

    return { u, x, cach: (tRef && tAcc) ? Math.round((tRef - tAcc) / 864e5) : null };
  });
  const demRef = {}; refRows.forEach(r => { demRef[r.x.referredByUid] = (demRef[r.x.referredByUid] || 0) + 1; });
  const nghiRef = refRows.map(r => {

    if(!ACC[g] && !LIC.some(l => l.uid === g)) co.push("người giới thiệu không phải tài khoản thật");
    if(demRef[g] >= 5) co.push(`người này đã giới thiệu ${demRef[g]} khách`);
    return co.length ? { uid:r.u, t: emailCua(r.u) || r.u, d:`giới thiệu bởi ${emailCua(g) || g} · ${co.join(" · ")}` } : null;
  }).filter(Boolean);
  them("vua","gioiThieu","Giới thiệu bạn bè đáng ngờ",
    "Thưởng chỉ trả khi bạn bè mua trọn gói 12 tháng, nhưng nên soát các ca lạ. Bật “Khoá gắn người giới thiệu muộn” trong Cài đặt để chặn từ gốc.", nghiRef, "cong-tac");

  const cu = Object.entries(ACC).filter(([u,a]) => a.migrated !== true && (ngay(a.paidUntil) || ngay(a.posUntil) || a.posActive === true))
    .map(([u,a]) => ({ uid:u, t:emailCua(u)||u, d:`Hạn đời cũ ${a.paidUntil ? ngayVN(a.paidUntil) : ""}${a.posUntil ? " · POS "+ngayVN(a.posUntil) : ""}${a.posActive===true ? " · POS vĩnh viễn" : ""}` }));
  them("nhe","doiCu","Còn sót hạn kiểu đời cũ","Máy chủ không dùng hạn này nữa, nhưng app khách có thể tưởng còn hạn rồi bị chặn. Mở hồ sơ, cấp giấy phép riêng rồi cắt quyền cũ.", cu);

  return R;
}

/* ══════════ GIỚI THIỆU BẠN BÈ — thưởng 1 tháng, chống cộng 2 lần bằng reflog ══════════
   Chép đúng lõi module cũ: transaction đọc referrals → reflog (đã thưởng thì dừng) → nối hạn. */
const THANG_THUONG = 1, GOI_TOI_THIEU = 12;
async function thuong(referredUid){
  try{
    return await runTransaction(fdb, async tx => {
      const rSnap = await tx.get(doc(fdb,"referrals",referredUid));
      if(!rSnap.exists()) return "no-referral";
      const rd = rSnap.data() || {}, referrer = rd.referredByUid, app = rd.appJoined;
      if(!referrer) return "no-referrer";
      if(!app) return "no-app";
      const logRef = doc(fdb,"accounts",referrer,"reflog",referredUid);
      if((await tx.get(logRef)).exists()) return "already";
      const licRef = doc(fdb,"accounts",referrer,"lic",app);
      const licSnap = await tx.get(licRef);
      const now = new Date();
      if(licSnap.exists()){
        const L = licSnap.data() || {};
        if(L.vinhVien === true && !L.paidUntil){
          tx.set(logRef, { app, months:THANG_THUONG, referredUid, referredEmail:(rd.email||""), referrerUid:referrer, note:"referrer_vinhvien", at:new Date() });
          return "ok";
        }
        const pud = ngay(L.paidUntil);
        const base = (pud && pud > now) ? pud : now;
        tx.set(licRef, { paidUntil: themThang(base, THANG_THUONG),
          lichSu: arrayUnion({ at:new Date(), boi:toiLa(), viec:"thuong_gioi_thieu", ghi:"giới thiệu "+(rd.email||referredUid) }) }, { merge:true });
      } else {
        tx.set(licRef, { app, paidUntil: themThang(now, THANG_THUONG), active:true, trial:false, vinhVien:false, trialUsed:true,
          lichSu: arrayUnion({ at:new Date(), boi:toiLa(), viec:"thuong_gioi_thieu", ghi:"giới thiệu "+(rd.email||referredUid) }) });
      }
      tx.set(logRef, { app, months:THANG_THUONG, referredUid, referredEmail:(rd.email||""), referrerUid:referrer, at:new Date() });
      return "ok";
    });
  }catch(e){ return "err:" + maLoi(e); }
}
async function thuongNeuDu(uid, app, months){
  if(!(months >= GOI_TOI_THIEU)) return "skip";
  const rd = REF[uid]; if(!rd || !rd.referredByUid || rd.appJoined !== app) return "skip";
  const kq = await thuong(uid);
  if(kq === "ok") bao(`🎁 Đã cộng ${THANG_THUONG} tháng cho người giới thiệu của ${rd.email || emailCua(uid) || uid}`);
  return kq;
}
/* Quét khi mở app: đơn 12 tháng đủ điều kiện mà chưa thưởng thì thưởng (chạy lại vô hại) */
async function quetThuong(){
  const ds = new Set();
  PAY.forEach(p => { if(pThang(p) < GOI_TOI_THIEU || !p.uid || !p.app) return;
    const rd = REF[p.uid]; if(rd && rd.referredByUid && rd.appJoined === p.app) ds.add(p.uid); });
  let co = 0;
  for(const u of ds){ const kq = await thuong(u); if(kq === "ok") co++; }
  return co;
}

/* Dấu vân tay giấy phép (hạn · vĩnh viễn · khoá · số suất). Lúc ghi mà khác lúc mở màn duyệt
   ⇒ có ai đó (bảng 👑 trong app khách, thưởng giới thiệu, máy khác) vừa sửa giấy phép này. */
const vanTayLic = l => { l = l || {}; const h = hanRules(l.paidUntil);
  return [h == null ? "" : h, l.vinhVien === true ? 1 : 0, l.active === false ? 0 : 1, Math.floor(num(l.qty))].join("|"); };
/* Đoán số tháng từ số tiền (tiền về không kèm đơn): khớp đúng bảng giá + khuyến mãi của khách */
function doanThang(uid, app, tien, qty){
  const g = giaCua(uid, app), q = laCN(app) ? Math.max(1, Math.floor(num(qty)) || 1) : 1;
  if(!(g > 0) || !(tien > 0)) return 0;
  for(let m = 1; m <= 24; m++) if(giaGiaHan(g, m) * q === tien) return m;
  return 0;
}
/* ĐẶT HẠN & GHI SỔ — [3.1] MỘT TRANSACTION: đọc lại đơn + giấy phép NGAY LÚC GHI.
   • Đơn đã duyệt/ẩn ở nơi khác (bảng 👑 trong app khách, máy khác, bấm 2 lần) ⇒ DỪNG, không cộng hạn 2 lần.
   • Giấy phép đổi sau lúc mở màn này ⇒ DỪNG, bắt tính lại (không lấy hạn cũ đã lỗi thời làm mốc).
   • Khoản tiền lấy từ sao kê có vân tay ⇒ dòng thu mang mã payments/sk_<vân tay>: một khoản tiền
     chỉ duyệt được ĐÚNG MỘT LẦN, kể cả khi mở 2 máy cùng lúc.                                     */
async function capHan({ uid, app, thang, soTien, qty, hanMoi, ghiChu, r, vanTay, saoKe }){
  if(!uid || !CFG.apps.includes(app)) throw new Error("Chưa chọn đúng gói");
  if(!(hanMoi instanceof Date) || isNaN(hanMoi)) throw new Error("Ngày hết hạn không hợp lệ");
  const cn = laCN(app), q = cn ? Math.min(50, Math.max(1, Math.floor(num(qty)) || 1)) : 0;
  const licRef = doc(fdb,"accounts",uid,"lic",app);
  const reqRef = (r && !r._cu) ? doc(fdb,"renewalRequests",r.id) : null;
  const ckMa = (saoKe && saoKe.ma) ? String(saoKe.ma) : "";
  const payRef = soTien !== 0 ? ((ckMa && !saoKe.yeu) ? doc(fdb,"payments","sk_" + ckMa) : doc(collection(fdb,"payments"))) : null;
  await runTransaction(fdb, async tx => {
    const ls = await tx.get(licRef);
    const rs = reqRef ? await tx.get(reqRef) : null;
    const ps = (payRef && ckMa && !saoKe.yeu) ? await tx.get(payRef) : null;
    if(ps && ps.exists()) throw new Error("Khoản tiền này ĐÃ dùng để duyệt rồi — không duyệt lần 2");
    if(reqRef){
      if(!rs.exists()) throw new Error("Đơn không còn trên máy chủ — tải lại số liệu");
      if(!rCho(rs.data() || {})) throw new Error("Đơn này VỪA được duyệt hoặc ẩn ở nơi khác — không duyệt lần 2");
    }
    const L = ls.exists() ? (ls.data() || {}) : {};
    if(vanTay != null && vanTayLic(L) !== vanTay)
      throw new Error("Giấy phép của khách vừa thay đổi sau khi bạn mở màn này — đóng lại, bấm Tải lại rồi duyệt lại để tính đúng hạn");
    const hanCu = ngay(L.paidUntil) || null;
    tx.set(licRef, sach({ app, paidUntil:hanMoi, vinhVien:false, active:true, trial:false, trialUsed:true,
        capNhat:new Date(), updatedAt:new Date(), ...(cn ? { qty:q } : {}),
        lichSu: arrayUnion(buoc("gia_han", { tien:soTien, thang, hanCu, hanMoi, ghi:ghiChu||"", ...(cn ? { qty:q, qtyCu:Math.floor(num(L.qty)) } : {}) })) }), { merge:true });
    if(payRef) tx.set(payRef, sach({ uid, app, months:thang, amount:soTien, at:new Date(), src: saoKe ? "sao_ke" : r ? "duyet" : "tay",
        ...(cn ? { qty:q } : {}), email:(r && r.email) || emailCua(uid) || "", hanCu, hanMoi,
        ghiChu: ghiChu || "", nguoiDuyet: toiLa(), ...(ckMa ? { ckMa, saoKe:String(saoKe.text || "").slice(0,300) } : {}) }));
    if(reqRef) tx.set(reqRef, { status:"done", ngStatus:"done", handledAt:new Date(), ck:deleteField() }, { merge:true });
    else if(r && r._cu) tx.set(doc(fdb,"accounts",r._uid), { posRequested:false }, { merge:true });
  });
  if(thang >= GOI_TOI_THIEU) await thuongNeuDu(uid, app, thang);
}

async function ghiLoat(uids, patchCua, viec, moTa){
  let xong = 0;

    const b = writeBatch(fdb);
    uids.slice(i, i+400).forEach((u, j) => b.set(doc(fdb,"accounts",u), patchCua(u, i+j), { merge:true }));

}

async function luuBangGia(vals){
  /* ô trống = xoá giá riêng (về giá chung/mặc định) · gõ 0 = miễn phí thật */
  /* [3.1] Giá chung chỉ là giá DỰ PHÒNG cho app chưa có ô giá riêng. Bản cũ để trống là ghi 0 ⇒ app nào
     đọc giá chung mà không chặn số 0 sẽ ra mã QR 0đ. Nay để trống / gõ 0 = XOÁ ô, mỗi app về giá mặc định. */
  const m = { bin:vals.bin, bankName:vals.bankName, account:vals.account, accName:vals.accName,
              pricePerMonth: vals.pricePerMonth > 0 ? vals.pricePerMonth : deleteField() };
  const doi = [];
  CFG.apps.forEach(a => { const k = CFG.oGia[a][0], t = String(vals["g_"+a] ?? "").trim();
    if(t === ""){ m[k] = deleteField(); doi.push(`${a}:—`); } else { m[k] = soTienNhap(t); doi.push(`${a}:${soTienNhap(t)}`); } });
  /* ngày dùng thử & hotline: ô trống = về mặc định của app khách (14 ngày · 0977 823 979) */
  m.ngayThu = vals.ngayThu ? vals.ngayThu : deleteField();
  m.hotline = vals.hotline ? vals.hotline : deleteField();
  doi.push(`thu:${vals.ngayThu || "mặc định"}`, `hotline:${vals.hotline || "mặc định"}`, `km:${JSON.stringify(vals.km)}`);
  /* Bảng khuyến mãi phải THAY TRỌN (setDoc merge sẽ trộn bảng cũ với bảng mới) ⇒ update riêng trường này, cùng một lô */
  const b = writeBatch(fdb), ref = doc(fdb,"billing","info");
  b.set(ref, m, { merge:true });
  b.update(ref, { kmGiaHan: vals.km });
  await b.commit();
  await ghiChung("doi_gia", { ghi: doi.join(" ") });
}

/* Số liệu kinh doanh của shop — nặng, chỉ đọc khi bấm */
async function docKinhDoanh(uid, ky, brIds){
  const n = new Date(); let f, t = null;
  if(ky === "truoc"){ f = new Date(n.getFullYear(), n.getMonth()-1, 1); t = new Date(n.getFullYear(), n.getMonth(), 1); }
  else if(ky === "30"){ f = new Date(Date.now() - 30*864e5); f.setHours(0,0,0,0); }
  else f = new Date(n.getFullYear(), n.getMonth(), 1);
  const kh = await getDocs(collection(fdb,"users",uid,"customers"));
  let noThu = 0, noTra = 0; const khach = [];
  kh.forEach(d => { const x = d.data() || {}, v = num(x.debt); khach.push({ ten:x.name || "(không tên)", no:v }); if(v > 0) noThu += v; else if(v < 0) noTra += -v; });
  khach.sort((a,b) => b.no - a.no);
  const ncc = await getDocs(collection(fdb,"users",uid,"suppliers")).catch(()=>null);
  let nccNo = 0; if(ncc) ncc.forEach(d => { nccNo += num((d.data()||{}).debt); });
  const cn = [];
  for(const b of brIds){
    const [sp, dh, tr] = await Promise.all([
      getDocs(bcol(uid,b,"products")).catch(()=>null),
      getDocs(query(bcol(uid,b,"orders"), where("createdAt",">=",f))).catch(()=>null),
      getDocs(query(bcol(uid,b,"returns"), where("at",">=",f))).catch(()=>null)
    ]);
    let nSp = 0, ton = 0, het = 0; if(sp) sp.forEach(d => { const x = d.data() || {}; nSp++; const st = num(x.stock); ton += st*num(x.cost); if(st <= 0) het++; });
    const hoan = {}; if(tr) tr.forEach(d => { const x = d.data() || {}; if(x.orderId) hoan[x.orderId] = (hoan[x.orderId]||0) + num(x.refund); });
    let don = 0, tien_ = 0, cash = 0, qr = 0, no = 0;
    if(dh) dh.forEach(d => { const x = d.data() || {}; const dt = ngay(x.createdAt) || ngay(x.createdAtMs);
      if(t && dt && dt >= t) return;
      const g = num(x.total), net = Math.max(0, g - Math.min(hoan[d.id] || 0, g));
      if(net > 0) don++; tien_ += net;
      if(x.method === "cash") cash += net; else if(x.method === "qr") qr += net; else if(x.method === "debt") no += net; });
    cn.push({ id:b, don, tien:tien_, cash, qr, no, sp:nSp, ton, het });
  }
  return { khach, soKhach:khach.length, noThu, noTra, nccNo, cn };
}

const cdlTs = v => { try{ const d = ngay(v); return d ? d.toISOString() : null; }catch(e){ return null; } };
function cdlSach(v){
  if(v === null || v === undefined || typeof v !== "object") return v;
  if(typeof v.toDate === "function" || v instanceof Date) return cdlTs(v);
  if(Array.isArray(v)) return v.map(cdlSach);
  if(typeof v.seconds === "number" && typeof v.nanoseconds === "number" && Object.keys(v).length <= 2)
    return new Date(v.seconds*1000 + Math.floor(v.nanoseconds/1e6)).toISOString();
  const o = {}; for(const k in v) o[k] = cdlSach(v[k]); return o;
}

function cdlRaJson(uid, email, kho){

    customers:[], pos:{ branches:[], suppliers:[], supplierPayments:[], staff:[], byBranch:{} } };

  kho.customers.slice().sort((a,b) => String((a.d||{}).name||"").localeCompare(String((b.d||{}).name||""),"vi")).forEach(c => {
    const x = cdlSach(c.d) || {};
    const txs = c.tx.slice().sort((p,q) => ms((p.d||{}).date) - ms((q.d||{}).date)).map(t => {
      const y = cdlSach(t.d) || {};

      if(y.att && (y.att.u || y.att.d)) o.att = y.att;

    out.customers.push({ id:c.id, name:x.name||"", phone:x.phone||"", address:x.address||"", debt:Number(x.debt)||0, shareToken:x.shareToken||null, transactions:txs });
  });
  let brs = kho.branches.map(b => ({ id:b.id, name:((b.d||{}).name)||"", nganh:((b.d||{}).nganh)||"", createdAt:cdlTs((b.d||{}).createdAt) }));
  if(!brs.find(b => b.id === "main")) brs.unshift({ id:"main", name:"Chi nhánh chính", createdAt:null });
  out.pos.branches = brs;
  out.pos.suppliers = (kho.suppliers||[]).map(s => { const x = cdlSach(s.d) || {}; return { id:s.id, name:x.name||"", phone:x.phone||"", address:x.address||"", debt:Number(x.debt)||0, createdAt:cdlTs(x.createdAt) }; });
  out.pos.supplierPayments = (kho.supplier_payments||[]).map(s => { const x = cdlSach(s.d) || {}; return { id:s.id, supplierId:x.supplierId||"", amount:Number(x.amount)||0, at:cdlTs(x.at) }; });
  out.pos.staff = (kho.staff||[]).map(s => { const x = cdlSach(s.d) || {}; return { id:s.id, name:x.name||"", pin:String(x.pin||""), role:x.role||"cashier", createdAt:cdlTs(x.createdAt) }; });
  brs.forEach(b => { const src = kho.pos[b.id] || {}, bd = {};
    CDL_CN.forEach(n => bd[n] = (src[n]||[]).map(r => Object.assign({ id:r.id }, cdlSach(r.d) || {})));

  return out;
}

/* ══════════════════════════ HỒ SƠ KHÁCH 360° ══════════════════════════ */
function nganhTheoMa(id){
  if(id === "main") return "";
  let m = /^main_(fnb|fs|rm|kg)$/.exec(id); if(m) return m[1];
  if(/^cn_[0-9]+$/.test(id)) return "";
  m = /^cn_(fnb|fs|rm|kg)_[0-9]+$/.exec(id); if(m) return m[1];
  return null;                                   /* mã cũ — không suy ra được ngành */
}
const TEN_NGANH = { "":"Bán hàng đa năng", fnb:"F&B", fs:"Thời trang", rm:"Karaoke/Spa", kg:"Cân ký/Bán sỉ" };
/* Tính ĐÚNG như Firestore Rules: duocMoCn() + duocMoNganh() cho 1 cửa hàng */
function luatCuaHang(uid, b){
  const acc = ACC[uid] || {};
  const laChinh = /^main(_(fnb|fs|rm|kg))?$/.test(b);
  const ng = nganhTheoMa(b);
  const batCn = CFGDB.enforceCn === true, batNg = CFGDB.enforceNganh === true, cnChung = CFGDB.cnChung !== false;
  let cnOk = true, cnLy = "Cửa hàng chính — miễn phí", maGoi = "", can = 0;
  if(!laChinh){
    const m = /^cn_(?:(fnb|fs|rm|kg)_)?([0-9]+)$/.exec(b);
    maGoi = m && m[1] ? "sono_cn_" + m[1] : "sono_cn";
    const soSuat = a => { const l = licCua(uid, a); return (l && conHan(l)) ? num(l.qty) : 0; };
    const q = cnChung ? Math.max(soSuat(maGoi), soSuat("sono_cn")) : soSuat(maGoi);
    const nS = m ? m[2] : null, n = nS != null ? Number(nS) : 0;
    const trongSuat = !!m && String(n) === nS && n >= 1 && n <= 20 && q >= n;
    const mt = acc.cnMienTru === true, cho = Array.isArray(acc.cnCho) && acc.cnCho.includes(b);
    cnOk = trongSuat || mt || cho; can = m ? n : 0;
    cnLy = trongSuat ? `Trong suất đã mua (${q} suất)` : mt ? "Tài khoản được miễn trừ" : cho ? "Mã cũ đã duyệt"
         : m ? (n > 20 ? "Số thứ tự trên 20 — phải duyệt riêng" : `Cần ${n} suất ${tenApp(maGoi)}, đang có ${q}`) : "Mã cũ chưa duyệt";
  }
  const licNg = ng ? "sono_" + ng : "";
  const ngOk = !licNg || conHan(licCua(uid, licNg));
  return { b, laChinh, ng, maGoi, can, cnOk, cnLy, licNg, ngOk,
    chan: (batCn && !cnOk) || (batNg && !ngOk), lau: (!batCn && !cnOk) || (!batNg && !ngOk) };
}

function nhatKy(){

function moCapHan({ r = null, uid = "", app = "", saoKe = null } = {}){

  const thang0 = r ? Math.min(24, Math.max(1, Math.floor(num((ck && ck.thang) || r.months)) || 1)) : 1;
  const qty0 = laCN(a) ? Math.min(50, Math.max(1, Math.floor(num((ck && ck.sl) || (r && r.qty))) || Math.floor(num(l.qty)) || 1)) : 1;

              vanTay: vanTayLic(licCua(u, a)), saoKe: saoKe || null };
  if(r) S.tien = num(ck && ck.tien != null ? ck.tien : (r.amount ?? r.soTien));
  if(saoKe){

/* [3.1] CÔNG BẰNG THEO SUẤT (gói chi nhánh tính theo số suất, cả gói chung MỘT ngày hết hạn).

   cộng nối hạn cũ nên CẢ 3 suất tới 10 tháng — 2 suất mua thêm hưởng không 18 suất-tháng.
   NAY: thời gian còn lại của số suất CŨ được chia đều cho số suất MỚI, rồi mới cộng số tháng vừa mua.
   Bớt suất thì ngược lại: phần còn lại dồn cho ít suất hơn ⇒ khách không mất đồng nào đã trả.

  let goc = bay, noi = "tính từ hôm nay", chia = null;
  if(conLai > 0){
    if(cn && q0 !== Q){

    const X = await napXLSX(), wb = X.read(await f.arrayBuffer(), { type:"array" });
    return wb.SheetNames.map(n => X.utils.sheet_to_csv(wb.Sheets[n], { FS:" | ", blankrows:false })).join("\n");
  }
  return await f.text();
}

const NHOM_NHAN = [["con","Khách còn hạn"],["tra","Đang trả tiền"],["thu","Đang dùng thử"],["het","Không còn gói nào"],["tat","Tất cả tài khoản"]];
function dsNhan(loc){
  const uids = [...new Set([...Object.keys(ACC), ...LIC.map(l => l.uid)])];
  return uids.filter(u => {
    const ls = licsCua(u), ma = ls.map(l => tt(l).ma);
    if(loc === "tat") return true;
    if(loc === "con") return ma.some(m => ["vv","tra","thu"].includes(m));
    if(loc === "tra") return ma.some(m => m === "tra" || m === "vv");
    if(loc === "thu") return ma.includes("thu");
    if(loc === "het") return !ma.some(m => ["vv","tra","thu"].includes(m));
    return false;
  });
}

const uidsSono = () => [...new Set([...Object.keys(ACC), ...LIC.filter(l => String(l.app).indexOf("sono") === 0).map(l => l.uid)])]
  .filter(u => String(emailCua(u)).toLowerCase() !== CFG.admin);
async function theoLo(ds, song, fn, tienDo){
  const out = []; let xong = 0;
  for(let i = 0; i < ds.length; i += song){
    const kq = await Promise.all(ds.slice(i, i+song).map(x => fn(x).catch(e => ({ loi: maLoi(e), x }))));
    out.push(...kq); xong += kq.length; if(tienDo) tienDo(xong, ds.length);
  }
  return out;
}

/* ── 1. CHI NHÁNH & GÓI NGÀNH: đúng từng điều kiện của Firestore Rules ── */
function hangCN(uid, ids){
  const L = ids.map(b => luatCuaHang(uid, b)), cho = (ACC[uid] || {}).cnCho;
  return { uid, ids, email: emailCua(uid) || uid, L, them: L.filter(x => !x.laChinh).length,
           lau: L.filter(x => x.lau), chan: L.filter(x => x.chan),
           maCu: L.filter(x => x.ng === null && !(Array.isArray(cho) && cho.includes(x.b))) };
}
/* Tính lại theo công tắc / miễn trừ / giấy phép MỚI NHẤT — không đọc lại máy chủ */
function tinhLaiQuetCN(){
  const q = QUET.cn; if(!q) return null;
  const tat = q.goc.map(g => hangCN(g.uid, g.ids));
  let tienLau = 0;
  tat.forEach(r => {
    r.lau.forEach(x => { if(!x.cnOk && x.maGoi) tienLau += giaCua(r.uid, x.maGoi); });
    new Set(r.L.filter(x => x.lau && x.licNg && !x.ngOk).map(x => x.licNg)).forEach(a => { tienLau += giaCua(r.uid, a); });
  });
  q.rows = tat.filter(r => r.them || r.lau.length || r.chan.length || r.L.some(x => x.licNg))
              .sort((a,b) => (b.lau.length + b.chan.length) - (a.lau.length + a.chan.length));
  q.soShop = tat.length; q.tienLau = tienLau;
  q.soLau = tat.reduce((s,r) => s + r.lau.length, 0); q.soChan = tat.reduce((s,r) => s + r.chan.length, 0);
  q.tom = `${q.soShop} shop · ${q.soLau} cửa hàng dùng chùa (~${tienGon(q.tienLau)}/tháng) · ${q.soChan} đang bị chặn · quét ${gioVN(new Date(q.luc))}`;
  return q;
}

  if(s.canChia && !(await hoi({ tieuDe:"Ca nghi vấn", noiDung:"• " + s.co.join("\n• ") + `\n\nLý do bạn chọn: ${lyTen}\nHạn sẽ GIỮ NGUYÊN, khách không được thêm ngày nào.`, nutOk:"Tiếp tục", nguy:true, go:"CHUYEN" }))) return bao("Đã dừng — chưa gõ đúng chữ CHUYEN");
  let vvTrong = false;
  if(s.licTrong.length){
    vvTrong = await hoi({ tieuDe:"Giấy phép chưa đặt hạn", noiDung:`${s.licTrong.map(l => l.app).join(", ")} đang là "dùng vô thời hạn" ở tài khoản cũ.\n\nĐồng ý = chuyển y nguyên và ghi rõ là VĨNH VIỄN.\nHuỷ = dừng lại để bạn đặt hạn trước.`, nutOk:"Ghi vĩnh viễn" });
    if(!vvTrong) return;
  }
  if(!(await hoi({ tieuDe:"Chuyển dữ liệu", noiDung:`Từ: ${s.mCu}\nSang: ${s.mMoi}\nLý do: ${lyTen}\n\n• Chép toàn bộ dữ liệu, giữ nguyên mã\n• Đổi chủ link nợ / hoá đơn / thực đơn QR\n• Chuyển ${s.licCu.length} giấy phép — GIỮ NGUYÊN HẠN\n• Chuyển miễn trừ chi nhánh (nếu có)\n• KHOÁ tài khoản nguồn, KHÔNG xoá dữ liệu cũ`, nutOk:"Chuyển", nguy:true }))) return;
  S.dang = true; S.log = ""; veChuyen(t);
  const log = m => { S.log += m + "\n"; const el = $("#cdlLog", t.than); if(el){ el.textContent = S.log; el.scrollTop = el.scrollHeight; } else veChuyen(t); };
  try{
    log("▶ BƯỚC 1 — Đọc dữ liệu tài khoản CŨ");
    const kho = await cdlLayKho(s.uCu, log); const d = cdlDem(kho);
    log(`  ✓ Tổng cộng ${d.tong} bản ghi`);
    if(S.saoLuu){ const ten = cdlTenFile(s.mCu, s.uCu); taiFile(cdlRaJson(s.uCu, s.mCu, kho), ten); log(`▶ BƯỚC 2 — Đã tải sao lưu: ${ten}`); }
    else log("▶ BƯỚC 2 — Bỏ qua sao lưu (bạn đã tắt)");
    let coSan = 0; try{ coSan = (await getDocs(collection(fdb,"users",s.uMoi,"customers"))).size; }catch(e){}
    if(coSan > 0 && !(await hoi({ tieuDe:"Tài khoản mới đã có dữ liệu", noiDung:`Tài khoản MỚI đang có ${coSan} khách. Chép vào sẽ TRỘN hai bộ dữ liệu (trùng mã ghi đè, khác mã cộng thêm).`, nutOk:"Vẫn chép", nguy:true }))){
      log("⛔ Đã huỷ — tài khoản mới đang có dữ liệu."); S.dang = false; veChuyen(t); return; }
    log("▶ BƯỚC 3 — Chép sang tài khoản MỚI");
    const soGhi = await cdlGhiKho(s.uMoi, kho, log);
    log(`  ✓ Đã ghi ${soGhi} bản ghi`);
    log("▶ BƯỚC 4 — Đổi chủ link chia sẻ");
    await cdlDoiChuLink(s.uMoi, kho, log);
    log("▶ BƯỚC 5 — Cấp phép phục hồi file");
    await setDoc(doc(fdb,"chuyen_dl",s.uMoi), { tuUid:s.uCu, tuEmail:s.mCu, capBoi:toiLa(), capLuc:new Date(), capLucMs:Date.now(), lyDo:S.ly,
      chuoiTruoc:(s.cpCu && s.cpCu.tuUid) || "", nghiVan:s.co.length, canChia:!!s.canChia });
    log("▶ BƯỚC 6 — Chuyển giấy phép (giữ nguyên hạn)");
    for(const l of s.licCu){
      const app = l.app, co = licCua(s.uMoi, app);
      const dichDaTra = !!co && (co.vinhVien === true || co.trial !== true);
      const hCu = ngay(l.paidUntil), hCo = co ? ngay(co.paidUntil) : null;
      const nd = { app };
      if(l.vinhVien === true && !hCu){ nd.vinhVien = true; nd.paidUntil = null; }
      else if(!hCu && vvTrong){ nd.vinhVien = true; nd.paidUntil = null; }
      else if(dichDaTra && co.vinhVien === true && !hCo){ nd.vinhVien = true; nd.paidUntil = null; }
      else if(dichDaTra){ nd.paidUntil = (hCu && hCo) ? (hCu > hCo ? hCu : hCo) : (hCu || hCo || null); nd.vinhVien = false;
        /* [3.1] Gói chi nhánh: bản cũ lấy max số suất × max hạn ⇒ 5 suất sắp hết + 1 suất còn 12 tháng
           thành 5 suất × 12 tháng (biếu không). Nay giữ đúng tổng suất-ngày đã trả của cả hai bên. */
        if(laCN(app) && hCu && hCo){ const bay = Date.now(), r1 = Math.max(0, hCu - bay), r2 = Math.max(0, hCo - bay);
          const q1 = Math.max(0, Math.floor(num(l.qty))), q2 = Math.max(0, Math.floor(num(co.qty))), Q = Math.max(q1, q2, 1);
          if(r1 > 0 && r2 > 0 && q1 + q2 > 0) nd.paidUntil = new Date(bay + Math.floor((q1 * r1 + q2 * r2) / Q)); } }
      else { nd.paidUntil = hCu; nd.vinhVien = false; }
      nd.trial = (l.trial === true) && !dichDaTra;
      nd.active = dichDaTra ? true : (l.active !== false);
      if(l.trialUsed === true || (co && co.trialUsed === true)) nd.trialUsed = true;
      const q = Math.max(num(l.qty), num(co && co.qty)); if(q > 0) nd.qty = q;
      await setDoc(doc(fdb,"accounts",s.uMoi,"lic",app), sach(nd), { merge:true });
      if(!l._cu) await setDoc(doc(fdb,"accounts",s.uCu,"lic",app), { active:false }, { merge:true });
      await ghiLic(s.uMoi, app, "nhan_chuyen", { tu:s.mCu, ghi:lyTen });
      if(!l._cu) await ghiLic(s.uCu, app, "da_chuyen_di", { sang:s.mMoi, ghi:lyTen });
      log(`  ✓ ${tenApp(app)}${l._cu ? " (đời cũ)" : ""} — ${nd.vinhVien ? "VĨNH VIỄN" : "hạn " + ngayVN(nd.paidUntil)}${nd.trial ? " (vẫn là dùng thử)" : ""}${nd.active === false ? " (đang khoá)" : ""}`);
    }
    log("▶ BƯỚC 7 — Trỏ máy nhân viên sang tài khoản mới");
    let nvOk = 0;
    for(const r of (kho.pos_nv || [])){ try{ await setDoc(doc(fdb,"nv_map",r.id), { shopUid:s.uMoi }, { merge:true }); nvOk++; }catch(e){ log(`  ⚠️ ${r.id}: ${maLoi(e)}`); } }
    log((kho.pos_nv || []).length ? `  ✓ ${nvOk}/${kho.pos_nv.length} máy nhân viên` : "  (không có máy nhân viên)");
    const aCu = ACC[s.uCu] || {};
    if(aCu.cnMienTru === true || (Array.isArray(aCu.cnCho) && aCu.cnCho.length)){
      log("▶ BƯỚC 8 — Chuyển miễn trừ chi nhánh");
      const p = {}; if(aCu.cnMienTru === true) p.cnMienTru = true; if(Array.isArray(aCu.cnCho) && aCu.cnCho.length) p.cnCho = arrayUnion(...aCu.cnCho);
      await setDoc(doc(fdb,"accounts",s.uMoi), p, { merge:true }); log("  ✓ Xong");
    }
    log("▶ BƯỚC 9 — Khoá cổng vào tài khoản nguồn (chặn tự mở lại dùng thử)");
    for(const app of ["sono","sono_pos"]){
      if(LIC.some(x => x.uid === s.uCu && x.app === app)) continue;
      try{ await setDoc(doc(fdb,"accounts",s.uCu,"lic",app), { app, active:false, trial:false, trialUsed:true, paidUntil:null, vinhVien:false,
             lichSu: arrayUnion(buoc("khoa_sau_chuyen", { sang:s.mMoi })) }, { merge:true }); log(`  ✓ Khoá ${tenApp(app)}`); }
      catch(e){ log(`  ⚠️ Chưa khoá được ${app}: ${maLoi(e)}`); }
    }
    try{ await setDoc(doc(fdb,"accounts",s.uCu), { migrated:true, lichSu: arrayUnion(buoc("cat_legacy", { ly:"chuyển sang " + s.mMoi })) }, { merge:true }); log("  ✓ Cắt quyền đời cũ"); }
    catch(e){ log("  ⚠️ Chưa cắt được quyền cũ: " + maLoi(e)); }
    await ghiTK(s.uMoi, "nhan_chuyen_du_lieu", { tu:s.mCu, ghi:lyTen });
    await ghiTK(s.uCu, "da_chuyen_du_lieu", { sang:s.mMoi, ghi:lyTen });
    await ghiChung("chuyen_du_lieu", { ghi:`${s.mCu} → ${s.mMoi} · ${lyTen} · ${s.licCu.length} giấy phép · ${soGhi} bản ghi${s.co.length ? ` · ${s.co.length} điểm nghi vấn` : ""}` }, s.uMoi);
    log(`\n✅ XONG. Bảo khách đăng nhập bằng ${s.mMoi} là thấy đủ dữ liệu.`);
    S.xong = true; bao("Đã chuyển dữ liệu");
    napDuLieu().then(veTatCa).catch(()=>{});
  }catch(e){
    log(`\n❌ Lỗi: ${maLoi(e)}\nGhi được tới đâu giữ tới đó. Bấm Sửa lại → Kiểm tra → Xác nhận để chạy tiếp (ghi đè cùng mã, không sinh trùng).`);
    bao("Chuyển chưa xong — xem nhật ký", 1);
  }
  S.dang = false; veChuyen(t);
}

async function taiDuLieuKhach(uid){

function chonFileNap(uid){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    let obj = null;
    try{ obj = JSON.parse(await f.text()); }catch(e){ return bao("File hỏng hoặc không phải .json", 1); }
    if(!obj || obj.app !== "sono-full") return bao('Không phải file "Sao lưu toàn bộ" (sono-full)', 1);
    moNapFile(uid, obj, f.name);
  };
  document.body.appendChild(inp); inp.click();
}
async function moNapFile(uid, obj, tenF){
  const email = emailCua(uid), cs = obj.customers || [], P = obj.pos || {};
  const brs = (P.branches && P.branches.length) ? P.branches : [{ id:"main" }];
  const nT = cs.reduce((s,c) => s + (((c && c.transactions) || []).length), 0);
  let nP = 0, nO = 0; brs.forEach(b => { const bd = (P.byBranch||{})[b.id] || {}; nP += (bd.products||[]).length; nO += (bd.orders||[]).length; });
  const coId = cs.some(c => ((c && c.transactions) || []).some(x => x && x.id));
  const chuF = String(obj.ownerUid || ""), khac = !!chuF && chuF !== uid;
  let cp = null; try{ const s = await getDoc(doc(fdb,"chuyen_dl",uid)); if(s.exists()) cp = s.data(); }catch(e){}
  const hopLe = !!cp && String(cp.tuUid || "") === chuF;
  const t = moTam({ tieuDe:"Nạp file dữ liệu" });
  t.than.innerHTML = `<div class="the">
      <div class="kv"><span>Vào tài khoản</span><span>${esc(email || uid)}</span></div>
      <div class="kv"><span>File</span><span>${esc(tenF)}</span></div>
      <div class="kv"><span>Của</span><span>${esc(obj.ownerEmail || chuF || "?")}</span></div>
      <div class="kv"><span>Xuất lúc</span><span>${esc(gioVN(obj.exportedAt))}</span></div>
      <div class="kv"><span>Nội dung</span><span>${cs.length} khách · ${nT} giao dịch · ${nP} sản phẩm · ${nO} đơn · ${brs.length} cửa hàng</span></div></div>
    <div class="bao ${khac ? (hopLe ? "canh" : "xau") : "tot"}">${khac ? (hopLe ? "File của TÀI KHOẢN KHÁC — đã có phép chuyển nên hợp lệ." : "File của TÀI KHOẢN KHÁC và CHƯA có phép chuyển. Nạp là bê dữ liệu người này sang người kia.") : "Đúng file của chính tài khoản này."}</div>
    <div class="bao ${coId ? "tot" : "canh"}">${coId ? "File có mã giao dịch — nạp lại nhiều lần không sinh trùng." : "File KHÔNG có mã giao dịch — nạp 2 lần sẽ sinh trùng giao dịch."}</div>
    <p class="nho">Trùng mã thì ghi đè, khác mã thì cộng thêm. Không xoá gì sẵn có. Không đụng tới giấy phép.</p>
    <div class="nhatky an" id="napLog"></div>`;
  t.chan.innerHTML = `<button class="nut nguy dac" data-act="nap-ok">Nạp vào</button>`;
  t.S = { uid, obj, tenF, khac, hopLe, email, chuF, cs, nT, nP, nO };
}
async function thucHienNap(t, btn){
  const S = t.S;
  if(S.khac && !S.hopLe && !(await hoi({ tieuDe:"File của tài khoản khác", noiDung:`File của ${S.obj.ownerEmail || S.chuF} và chưa có phép chuyển.\nVẫn nạp vào ${S.email || S.uid}?`, nutOk:"Vẫn nạp", nguy:true }))) return;
  if(!(await hoi({ tieuDe:"Nạp dữ liệu", noiDung:`Vào: ${S.email || S.uid}\nFile: ${S.tenF}\n\n${S.cs.length} khách · ${S.nT} giao dịch · ${S.nP} sản phẩm · ${S.nO} đơn\nGiấy phép KHÔNG bị đụng tới.`, nutOk:"Nạp" }))) return;
  const el = $("#napLog", t.than); el.classList.remove("an");
  const log = m => { el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
  await chay(btn, async () => {
    const n = await cdlNapKho(S.uid, S.obj, log);
    log(`\n✅ XONG — đã ghi ${n} bản ghi. Bảo khách mở app, kéo xuống làm mới là thấy.`);
    await ghiTK(S.uid, "nap_du_lieu", { ghi:`${S.tenF} · ${n} bản ghi` });
    await ghiChung("nap_du_lieu", { ghi:`${S.email || S.uid} ← ${S.tenF} · ${n} bản ghi${S.khac ? ` · file của ${S.obj.ownerEmail || S.chuF}${S.hopLe ? " (có phép)" : " (KHÔNG phép)"}` : ""}` }, S.uid);
    bao("Đã nạp dữ liệu");
    t.chan.innerHTML = `<button class="nut chinh" data-act="dong-tam">Xong</button>`;
  }, "Đang nạp…");
}

function giaiThichLoiMK(ma){

  if(/unauthenticated/i.test(ma)) return "Phiên đăng nhập đã hết hạn. Đăng xuất rồi vào lại.";
  if(/permission-denied/i.test(ma)) return "Cloud Function không công nhận tài khoản đang đăng nhập là admin.";
  if(/deadline|unavailable|network|internal/i.test(ma)) return "Không gọi được máy chủ (mạng chập chờn hoặc hàm đang khởi động). Thử lại sau vài giây.";

function veQrThu(t){

function veNhatKyTam(t){

async function doiCongTacUI(b){
  const k = b.dataset.k, dong = CONG_TAC.find(x => x[0] === k); if(!dong) return;
  const dang = dong[3](CFGDB[k]), moi = !dang;
  let nd = `${dong[1]}: ${dang ? "BẬT → TẮT" : "TẮT → BẬT"}\n\n${dong[2]}`, nguy = false;
  if(k === "enforce" && !moi){ nd = "TẮT bắt buộc giấy phép = MỌI khách dùng MIỄN PHÍ toàn bộ app.\n\nChỉ làm khi đang sửa sự cố."; nguy = true; }
  if((k === "enforceCn" || k === "enforceNganh") && moi){
    b.disabled = true; bao("Đang quét xem bật lên ai sẽ bị chặn…");
    try{ await quetChiNhanh(); }catch(e){ b.disabled = false; return bao("Chưa quét được: " + maLoi(e), 1); }
    b.disabled = false;
    const ds = QUET.cn.rows.map(r => ({ r, x: r.L.filter(x => k === "enforceCn" ? !x.cnOk : (x.licNg && !x.ngOk)) })).filter(o => o.x.length);

async function capOk(t, btn){
  const S = t.S; if(!S) return;
  if(!S.app) return bao("Chưa chọn gói", 1);
  const c = tinhCapHan(S);
  const hanMoi = new Date(String(S.han) + "T23:59:00");
  if(!S.han || isNaN(hanMoi)) return bao("Chưa chọn ngày hết hạn", 1);
  if(S.tien < 0) return bao("Số tiền không được âm — dùng dòng điều chỉnh ở tab Tiền", 1);
  const hoiLai = [];
  if(hanMoi <= new Date()) hoiLai.push(`Ngày hết hạn ${ngayVN(hanMoi)} đã qua — khách bị chặn ngay.`);
  if(soNgay(hanMoi) > 400) hoiLai.push(`Hạn tới ${ngayVN(hanMoi)}, hơn 13 tháng.`);
  const vua = PAY.filter(p => p.uid === S.uid && p.app === S.app && pTien(p) > 0 && pNgay(p) && (Date.now() - pNgay(p)) < 3*864e5)[0];
  if(vua) hoiLai.push(`Gói này VỪA thu ${tienD(pTien(vua))} ${lauRoi(pNgay(vua))}. Chắc đây là khoản chuyển mới, không phải duyệt trùng?`);
  if(S.tien === 0) hoiLai.push("Số tiền 0đ: chỉ cấp hạn, KHÔNG ghi dòng doanh thu.");
  else if(S.tien < c.chuan) hoiLai.push(`Thu ${tienD(S.tien)}, ít hơn bảng giá ${tienD(c.chuan - S.tien)}.`);
  if(S.saoKe && S.saoKe.ma){
    const da = PAY.find(p => p.ckMa === S.saoKe.ma);
    if(da && !S.saoKe.yeu) return bao(`Khoản tiền này đã dùng để duyệt lúc ${gioVN(pNgay(da))} (${emailCua(da.uid) || da.uid}) — không duyệt lần 2`, 1);
    if(da) hoiLai.push(`Có vẻ khoản tiền này đã dùng để duyệt lúc ${gioVN(pNgay(da))} cho ${emailCua(da.uid) || da.uid}.`);
  }
  if(S.r && S.tien > 0 && !(S.r.ck && typeof S.r.ck === "object") && !S.saoKe)
    hoiLai.push("Khách CHƯA bấm “Đã chuyển khoản” và bạn chưa đối soát sao kê. Chỉ duyệt khi ĐÃ THẤY TIỀN VỀ tài khoản.");
  const tom = `${tenApp(S.app)} · ${S.thang} tháng${laCN(S.app) ? ` · ${S.qty} suất` : ""}\nHạn mới: ${ngayVN(hanMoi)}\nGhi sổ: ${tienD(S.tien)}`;
  if(!(await hoi({ tieuDe: S.r ? "Duyệt đơn" : "Đặt hạn", noiDung: (hoiLai.length ? "⚠️ " + hoiLai.join("\n⚠️ ") + "\n\n" : "") + tom, nutOk: S.r ? "Duyệt" : "Đặt hạn", nguy: hoiLai.length > 0 }))) return;
  let xong = false;
  await chay(btn, async () => {
    await capHan({ uid:S.uid, app:S.app, thang:S.thang, soTien:S.tien, qty:S.qty, hanMoi, ghiChu:S.ghi, r:S.r, vanTay:S.vanTay, saoKe:S.saoKe });
    xong = true;
  }, "Đang ghi…");
  if(!xong) return;
  dongTam(t);
  bao(S.tien !== 0 ? `Đã mở hạn tới ${ngayVN(hanMoi)} và ghi ${tienD(S.tien)}` : `Đã mở hạn tới ${ngayVN(hanMoi)}`);
  await taiLai(true);
}

      if (d.col  != null && isFinite(d.col))  rec.col  = d.col | 0;

  var _RE_NGOAI = /zalojsv2|zalojavascriptinterface|zalojs|jsbridge|fbquacamera|fb_?native|fb_?iab|reactnativewebview|webkit\.messagehandlers|__gcrweb|instantsearchsdkjsbridge|resizeobserver loop|failed to (?:register|update|install) a serviceworker|when fetching the script|-extension:\/\//i;

    if (/<anonymous>:1:\d+/.test(stk == null ? "" : stk) && s.indexOf(".html") < 0 && s.indexOf(".js") < 0) return true;
